<style>
:root{--blue:#155eef;--blue2:#0b45bd;--ink:#172033;--muted:#667085;--line:#e7ebf2;--bg:#f5f7fb;--card:#fff;--green:#079455;--red:#d92d20;--shadow:0 12px 32px rgba(16,24,40,.07);--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;color:var(--blue);cursor:pointer}.brandmark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#3984ff,#1047c5);color:#fff;display:grid;place-items:center;font-size:22px}.navlinks{display:flex;gap:8px;align-items:center}.navlinks button,.linkbtn{border:0;background:transparent;color:#344054;padding:10px 13px;border-radius:11px}.navlinks button:hover,.linkbtn:hover{background:#f0f4ff;color:var(--blue)}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:11px 17px;font-weight:700;box-shadow:0 5px 14px #155eef25}.btn:hover{background:var(--blue2)}.btn.secondary{background:#eef4ff;color:var(--blue);box-shadow:none}.btn.ghost{background:#fff;color:#344054;border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff0ee;color:var(--red);box-shadow:none}.btn.small{padding:8px 12px;font-size:13px}.hero{padding:54px 0 34px;background:radial-gradient(circle at 80% 10%,#dceaff 0,transparent 36%),linear-gradient(120deg,#f7faff,#edf4ff)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}.eyebrow{color:var(--blue);font-weight:800;font-size:13px}.hero h1{font-size:clamp(29px,5vw,48px);line-height:1.5;margin:9px 0 10px}.hero p{color:var(--muted);font-size:16px;line-height:2;margin:0 0 22px}.hero-art{min-height:245px;border-radius:28px;background:linear-gradient(140deg,#1359df,#4a95ff);color:white;padding:28px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 22px 45px #155eef30;overflow:hidden;position:relative}.hero-art strong{font-size:27px;z-index:1}.hero-art span{z-index:1;color:#e4edff}.searchbox{background:#fff;padding:15px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:13px;color:#475467;font-weight:700}.field input,.field select,.field textarea,.searchbox input,.searchbox select{width:100%;border:1px solid #d9e0eb;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;min-width:0}.field textarea{min-height:95px;resize:vertical}.section{padding:34px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.section h2{margin:0;font-size:23px}.muted,.meta{color:var(--muted)}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{border:1px solid var(--line);background:#fff;border-radius:16px;padding:17px 10px;text-align:center;transition:.2s;cursor:pointer}.cat:hover{border-color:#9dbdff;transform:translateY(-3px);box-shadow:var(--shadow)}.cat .ico{font-size:27px;display:block;margin-bottom:8px}.cat b{font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 12px #10182808}.card-body{padding:16px}.cover{height:155px;background:linear-gradient(130deg,#eaf1ff,#d5e4ff);display:grid;place-items:center;color:#6b91d8;font-size:42px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.card h3{margin:0 0 7px;font-size:17px}.meta{font-size:13px;line-height:1.9}.price{font-weight:900;color:var(--blue);margin-top:9px}.empty{background:#fff;border:1px dashed #cfd7e5;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}.footer{background:#101d35;color:#d8e3f7;padding:32px 0;margin-top:30px}.footer small{color:#9db0ce}.page{padding:28px 0 60px;min-height:65vh}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 16px #10182808}.panel h2,.panel h3{margin-top:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tabs,.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab,.crumb{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:11px;color:#475467}.tab.active,.crumb.active{background:#eaf1ff;color:var(--blue);border-color:#c7d9ff;font-weight:800}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.modal{position:fixed;inset:0;background:#10182880;z-index:60;display:grid;place-items:center;padding:16px}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f2f4f7;border-radius:10px;width:34px;height:34px}.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:90;background:#172033;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);max-width:90%;font-size:14px}.toast.error{background:#b42318}.detail-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.detail-image{height:280px;border-radius:18px;background:#eaf1ff;overflow:hidden}.detail-image img{width:100%;height:100%;object-fit:cover}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.choice{display:flex;justify-content:space-between;align-items:center;text-align:right;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;margin-bottom:9px}.choice:hover{border-color:#9dbdff;background:#f8fbff}.choice small{display:block;color:var(--muted);margin-top:4px}.status{display:inline-block;padding:5px 10px;border-radius:30px;background:#fff4d6;color:#8a5b00;font-size:12px}.status.good{background:#e8f7ef;color:#067647}.status.bad{background:#fff0ee;color:#b42318}.side-actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#667085;background:#f9fafb}.mobilemenu{display:none}
/* Password Eye Icon Styles */

@media(max-width:850px){.hero-grid,.detail-layout{grid-template-columns:1fr}.hero-art{min-height:170px}.searchbox{grid-template-columns:1fr 1fr}.categories{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){.wrap{width:min(100% - 22px,1160px)}.nav{height:62px}.brand{font-size:18px}.navlinks button{font-size:12px;padding:7px}.hero{padding:32px 0 25px}.searchbox{grid-template-columns:1fr}.categories,.grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.three{grid-template-columns:1fr}.section{padding:25px 0}.panel{padding:15px}.hero-art strong{font-size:22px}}

<body>
<header class="topbar">
    <div class="wrap nav">
        <div class="brand" onclick="go('home')"><span class="brandmark">ن</span><span>نیازیـار</span></div>
        <nav class="navlinks">
            <button onclick="go('home')">خانه</button>
            <button onclick="startSearch()">جست‌وجو</button>
            <button onclick="go('dashboard')">پنل من</button>
            <button id="authNav" class="btn small" onclick="openAuth('login')">ورود / ثبت‌نام</button>
            <button id="logoutNav" class="linkbtn hidden" onclick="logout()">خروج</button>
        </nav>
    </div>
</header>
<main id="app"></main>
<footer class="footer"><div class="wrap"><div style="font-size:20px;font-weight:900;margin-bottom:8px">نیازیـار</div><div>دایرکتوری هوشمند کسب‌وکارها و خدمات</div><p><small>راهی ساده برای پیدا کردن خدمات و معرفی کسب‌وکارها</small></p></div></footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><strong id="modalTitle">ورود</strong><button class="close" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';


/* ⚠️ آدرس جدید تنظیم شد */
const API_URL='https://script.google.com/macros/s/AKfycbytt027SOKFskVIT0FoUsFOm_ffmIYz6TmEbF47t2Knb3GFr9YDdSFpxlFokL2g9FOw/exec';
const TOKEN_KEY='niyazyar_token_v20';
const state={page:'home',token:localStorage.getItem(TOKEN_KEY)||'',user:null,categories:[],subcategories:[],subbranches:[],locations:[],businesses:[],services:[],results:[],selectedBusiness:null,selectedService:null,activeTab:'businesses',path:{category_id:'',subcategory_id:'',subbranch_id:''},location:{province_id:'',city_id:''},search:{q:'',item_type:'',sort:'newest',attribute_filters:[]},fields:[],attributes:{},editingService:null};


const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faNum=v=>String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹');
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className='toast'+(e?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),4000)}
function unwrap(r){if(r==null)throw Error('پاسخی از سرور دریافت نشد.');if(typeof r==='string'){try{r=JSON.parse(r)}catch{throw Error(r)}}if(r.ok===false||r.success===false)throw Error(r.message||(r.error&&r.error.message)||'درخواست ناموفق بود.');return r.data!==undefined?r.data:r}
function arr(x,...keys){if(Array.isArray(x))return x;if(!x||typeof x!=='object')return[];for(const k of keys)if(Array.isArray(x[k]))return x[k];if(x.data!==undefined)return arr(x.data,...keys);return[]}


async function api(method,action,payload={}){
    let raw;
    if(window.google?.script?.run){
        raw=await new Promise((resolve,reject)=>{
            let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e?.message||'خطای ارتباط')));
            if(method==='GET')r.v20HandleGetAction(action,payload);else r.v20HandlePostAction(action,{action,...payload})
        })
    }else{
        if(!API_URL)throw Error('نشانی Web App مربوط به Apps Script هنوز در API_URL تنظیم نشده است.');
        let url=API_URL;
        if(method==='GET'){
            let q=new URLSearchParams({action,...Object.fromEntries(Object.entries(payload).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]))});
            raw=await(await fetch(url+(url.includes('?')?'&':'?')+q,{redirect:'follow'})).json()
        }else{
            raw=await(await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})})).json()
        }
    }
    return unwrap(raw)
}
function dataObj(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function locName(id){return state.locations.find(x=>String(x.location_id)===String(id))?.location_name||''}
function catName(id){return state.categories.find(x=>String(x.category_id)===String(id))?.category_name||''}
function subName(id){return state.subcategories.find(x=>String(x.subcategory_id)===String(id))?.subcategory_name||''}
function branchName(id){return state.subbranches.find(x=>String(x.subbranch_id)===String(id))?.subbranch_name||''}
function money(v,t='fixed'){if(t==='negotiable')return'توافقی';if(t==='free')return'رایگان';if(t==='contact')return'تماس بگیرید';if(v===''||v==null)return'تماس بگیرید';let n=Number(v);return Number.isFinite(n)?faNum(n.toLocaleString('en-US'))+' تومان':esc(v)}


/* =====================================================
   SPA History Manager (دکمه برگشت گوشی)
   ===================================================== */
function getHistoryState(page) {
    return {
        page: page,
        path: JSON.parse(JSON.stringify(state.path)),
        search: JSON.parse(JSON.stringify(state.search)),
        location: JSON.parse(JSON.stringify(state.location)),
        selectedService: state.selectedService,
        selectedBusiness: state.selectedBusiness
    };
}


if (!history.state || !history.state.page) {
    const emptyState = {
        page: 'sentinel',
        path: { category_id:'', subcategory_id:'', subbranch_id:'' },
        search: { q:'', item_type:'', sort:'newest', attribute_filters:[] },
        location: { province_id:'', city_id:'' }
    };
    history.pushState(emptyState, '', '#sentinel');
    history.pushState({ ...emptyState, page:'home' }, '', '#home');
}


window.addEventListener('popstate', function(e) {
    if (!e.state || !e.state.page || e.state.page === 'sentinel') {
        history.pushState(
            { page:'home', path:{category_id:'',subcategory_id:'',subbranch_id:''}, search:{q:'',item_type:'',sort:'newest',attribute_filters:[]}, location:{province_id:'',city_id:''} },
            '',
            '#home'
        );
        state.page = 'home';
        state.path = { category_id:'', subcategory_id:'', subbranch_id:'' };
        state.search = { q:'', item_type:'', sort:'newest', attribute_filters:[] };
        state.location = { province_id:'', city_id:'' };
        state.selectedService = null;
        state.selectedBusiness = null;
        render();
        loadHomeResults();
        return;
    }


    state.page = e.state.page;
    if (e.state.path) state.path = e.state.path;
    if (e.state.search) state.search = e.state.search;
    if (e.state.location) state.location = e.state.location;
    if (e.state.selectedService !== undefined) state.selectedService = e.state.selectedService;
    if (e.state.selectedBusiness !== undefined) state.selectedBusiness = e.state.selectedBusiness;


    render();
    if (state.page === 'dashboard' && state.token) loadDashboard();
    if (state.page === 'home') loadHomeResults();
    if (state.page === 'search') loadSearch();
});


/* ===================================================== */


async function init(){
    try{
        const [tree,locations]=await Promise.all([api('GET','categories_tree'),api('GET','locations')]);
        state.categories=arr(tree.categories,'categories');
        state.subcategories=arr(tree.subcategories,'subcategories');
        state.subbranches=arr(tree.subbranches,'subbranches');
        state.locations=arr(locations,'locations')
    }catch(e){
        console.warn(e);toast('دریافت اطلاعات پایه ناموفق بود: '+e.message,true)
    }
    if(state.token){
        try{state.user=dataObj(await api('POST','get_profile',{token:state.token}));}catch{state.token='';localStorage.removeItem(TOKEN_KEY)}
    }
    if (!history.state || !history.state.page) {
        history.pushState(getHistoryState('home'), '', '#home');
    }
    render();
    if(state.page==='home')loadHomeResults()
}
function header(){ $('authNav').classList.toggle('hidden',!!state.token);$('logoutNav').classList.toggle('hidden',!state.token)}
function go(p){
    history.pushState(getHistoryState(p), '', '#' + p);
    state.page=p;
    render();
    if(p==='dashboard'&&state.token)loadDashboard();
    if(p==='home')loadHomeResults()
}
function render(){
    header();
    let a=$('app');
    if(state.page==='home')a.innerHTML=homeView();
    else if(state.page==='search')a.innerHTML=searchView();
    else if(state.page==='service')a.innerHTML=serviceView();
    else if(state.page==='business')a.innerHTML=businessView();
    else if(state.page==='dashboard')a.innerHTML=dashboardView();
    else a.innerHTML=homeView()
}
function provinceOptions(sel=''){return '<option value="">همه استان‌ها</option>'+state.locations.filter(x=>String(x.location_type).toLowerCase()==='province').map(x=>`<option value="${esc(x.location_id)}" ${String(x.location_id)===String(sel)?'selected':''}>${esc(x.location_name)}</option>`).join('')}
function cityOptions(prov='',sel=''){return '<option value="">همه شهرها</option>'+state.locations.filter(x=>String(x.location_type).toLowerCase()==='city'&&String(x.parent_id)===String(prov)).map(x=>`<option value="${esc(x.location_id)}" ${String(x.location_id)===String(sel)?'selected':''}>${esc(x.location_name)}</option>`).join('')}
function homeView(){
    let icons=['🍽️','💇','🚗','🛠️','🏠','🛍️'];
    let chosen=['خوراک و کافه','سالن زیبایی','خودرو','خدمات فنی','املاک','فروشگاه‌ها'];
    let cats=state.categories.map(c=>({c,idx:chosen.indexOf(c.category_name)})).filter(x=>x.idx>=0).sort((a,b)=>a.idx-b.idx);
    if(!cats.length)cats=state.categories.slice(0,6).map((c,i)=>({c,idx:i}));
    return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">دایرکتوری هوشمند کسب‌وکارها و خدمات</div><h1>هر نیازی،<br>یک راه ساده برای پیدا کردن</h1><p>کسب‌وکارها، فروشگاه‌ها و خدمات موردنیازتان را جست‌وجو کنید؛ یا کسب‌وکار خود را در نیازیـار معرفی کنید.</p><div class="searchbox"><input id="homeQ" placeholder="نام خدمت، محصول یا کسب‌وکار..." onkeydown="if(event.key==='Enter')homeSearch()"><select id="homeProvince">${provinceOptions()}</select><select id="homeType"><option value="">همه موارد</option><option value="service">خدمات</option><option value="product">محصولات</option><option value="menu">منو</option></select><button class="btn" onclick="homeSearch()">جست‌وجو</button></div></div><div class="hero-art"><strong>نیازیـار<br>دایرکتوری هوشمند نیازها</strong><span>معرفی کسب‌وکار • جست‌وجوی خدمات • ارتباط مستقیم</span></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><h2>دسته‌بندی‌ها</h2><div class="muted">از دسته موردنظر شروع کنید</div></div><button class="btn ghost small" onclick="startSearch()">همه دسته‌ها</button></div><div class="categories">${cats.map(x=>`<button class="cat" onclick="chooseCategory('${esc(x.c.category_id)}')"><span class="ico">${icons[x.idx]||'▦'}</span><b>${esc(x.c.category_name)}</b></button>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><h2>جدیدترین خدمات و محصولات</h2><div class="muted">آخرین موارد تأییدشده و قابل نمایش</div></div><button class="btn secondary small" onclick="startSearch()">مشاهده همه</button></div><div id="homeResults" class="grid"><div class="empty">در حال دریافت اطلاعات...</div></div></div></section>`
}
async function loadHomeResults(){
    let el=$('homeResults');if(!el)return;
    try{
        let d=await api('GET','search_services',{sort:'newest',page:1,limit:6});
        let rows=arr(d,'items','results');
        el.innerHTML=rows.length?rows.map(serviceCard).join(''):'<div class="empty" style="grid-column:1/-1">هنوز آگهی عمومی تأییدشده‌ای ثبت نشده است.</div>'
    }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function startSearch(){
    state.path={category_id:'',subcategory_id:'',subbranch_id:''};
    state.search={q:'',item_type:'',sort:'newest',attribute_filters:[]};
    go('search');
    loadSearch();
}
function chooseCategory(id){
    state.path={category_id:id,subcategory_id:'',subbranch_id:''};
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}
function chooseSubcategory(id){
    state.path.subcategory_id=id;
    state.path.subbranch_id='';
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}
function chooseBranch(id){
    state.path.subbranch_id=id;
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}
function pathLabel(){
    let p=[];
    if(state.path.category_id)p.push(catName(state.path.category_id));
    if(state.path.subcategory_id)p.push(subName(state.path.subcategory_id));
    if(state.path.subbranch_id)p.push(branchName(state.path.subbranch_id));
    return p
}
function backToLevel(i){
    if(i<0){startSearch();return}
    if(i===0){state.path.subcategory_id='';state.path.subbranch_id=''}
    else if(i===1){state.path.subbranch_id=''}
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}
function searchLevel(){
    if(!state.path.category_id)return'categories';
    if(!state.path.subcategory_id&&state.subcategories.some(x=>String(x.category_id)===String(state.path.category_id)))return'subcategories';
    if(state.path.subcategory_id&&!state.path.subbranch_id&&state.subbranches.some(x=>String(x.subcategory_id)===String(state.path.subcategory_id)))return'subbranches';
    return'final'
}
function searchView(){
    let level=searchLevel(),p=pathLabel();
    return `<div class="page"><div class="wrap"><div class="toolbar"><div><h2 style="margin:0">جست‌وجوی مرحله‌ای</h2><div class="muted">با انتخاب هر مرحله، نتایج همان مسیر محدودتر می‌شوند.</div></div><div class="row"><button class="btn ghost small" onclick="openLocationFilter()">📍 ${state.location.province_id?esc(locName(state.location.province_id))+(state.location.city_id?'، '+esc(locName(state.location.city_id)):''):'فیلتر استان و شهر'}</button><button class="btn ghost small" onclick="startSearch()">شروع مجدد</button></div></div><div class="crumbs"><button class="crumb" onclick="startSearch()">همه دسته‌ها</button>${p.map((x,i)=>`<button class="crumb ${i===p.length-1?'active':''}" onclick="backToLevel(${i})">${esc(x)}</button>`).join('')}</div><div class="panel" style="margin-bottom:18px"><div class="row" style="justify-content:space-between"><div><b>${level==='categories'?'مرحله اول: انتخاب دسته اصلی':level==='subcategories'?'انتخاب زیردسته':level==='subbranches'?'انتخاب زیرمجموعه':'فهرست آگهی‌های مرتبط'}</b><div class="muted" style="font-size:13px">${level==='final'?'در این مرحله می‌توانید مشخصات تخصصی را هم فیلتر کنید.':'گزینه‌های همین سطح را انتخاب کنید؛ گزینه‌های قبلی تکرار نمی‌شوند.'}</div></div><input id="searchQ" style="max-width:250px" placeholder="جست‌وجوی عنوان یا نام کسب‌وکار" value="${esc(state.search.q)}" onkeydown="if(event.key==='Enter'){state.search.q=this.value;loadSearch()}" /></div><div id="stepOptions" style="margin-top:16px">${renderStepOptions(level)}</div>${level==='final'?`<div id="dynamicFilters" class="three" style="margin-top:15px"></div><div class="row"><button class="btn small" onclick="applyDynamicFilters()">اعمال مشخصات تخصصی</button><select id="sortSearch" onchange="state.search.sort=this.value;loadSearch()" style="max-width:180px"><option value="newest">جدیدترین</option><option value="price_asc">ارزان‌ترین</option><option value="price_desc">گران‌ترین</option></select></div>`:''}</div><div class="toolbar"><strong id="resultCount">آگهی‌های مرتبط</strong><span class="muted">نتایج با تمام انتخاب‌های قبلی هماهنگ‌اند.</span></div><div id="searchResults" class="grid"><div class="empty">در حال دریافت آگهی‌ها...</div></div></div></div>`
}
function renderStepOptions(level){
    let rows=[];
    if(level==='categories')rows=state.categories.map(x=>({id:x.category_id,name:x.category_name,sub:'انتخاب دسته اصلی',fn:'chooseCategory'}));
    if(level==='subcategories')rows=state.subcategories.filter(x=>String(x.category_id)===String(state.path.category_id)).map(x=>({id:x.subcategory_id,name:x.subcategory_name,sub:'زیردسته',fn:'chooseSubcategory'}));
    if(level==='subbranches')rows=state.subbranches.filter(x=>String(x.subcategory_id)===String(state.path.subcategory_id)).map(x=>({id:x.subbranch_id,name:x.subbranch_name,sub:'زیرمجموعه',fn:'chooseBranch'}));
    if(level==='final')return '<div class="muted">به انتهای شاخه دسته‌بندی رسیدید. آگهی‌های منطبق در پایین نمایش داده می‌شوند.</div>';
    return rows.length?rows.map(x=>`<button class="choice" onclick="${x.fn}('${esc(x.id)}')"><span><b>${esc(x.name)}</b><small>${x.sub}</small></span><b>‹</b></button>`).join(''):'<div class="empty">در این سطح گزینه فعالی ثبت نشده است.</div>'
}
async function loadSearch(){
    if(state.page!=='search')return;
    let el=$('searchResults');if(el)el.innerHTML='<div class="empty">در حال دریافت آگهی‌ها...</div>';
    let level=searchLevel();
    try{
        let p={...state.path,...state.location,q:state.search.q,item_type:state.search.item_type,sort:state.search.sort,page:1,limit:30};
        Object.keys(p).forEach(k=>{if(p[k]===''||p[k]==null)delete p[k]});
        if(level!=='final')delete p.attribute_filters;
        if(state.search.attribute_filters.length)p.attribute_filters=JSON.stringify(state.search.attribute_filters);
        let d=await api('GET','search_services',p);
        state.results=arr(d,'items','results');
        if(el)el.innerHTML=state.results.length?state.results.map(serviceCard).join(''):'<div class="empty" style="grid-column:1/-1">در این مسیر آگهی قابل نمایشی پیدا نشد.</div>';
        let count=$('resultCount');if(count)count.textContent=`${faNum(d.total??state.results.length)} آگهی مرتبط`;
        if(level==='final')await loadDynamicFields()
    }catch(e){if(el)el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function loadDynamicFields(){
    let box=$('dynamicFilters');if(!box)return;
    try{
        let d=await api('POST','get_category_fields',{category_id:state.path.category_id,subcategory_id:state.path.subcategory_id,subbranch_id:state.path.subbranch_id});
        state.fields=arr(d,'fields').filter(x=>x.is_filterable);
        box.innerHTML=state.fields.map(f=>fieldControl(f,'filter')).join('')
    }catch(e){box.innerHTML=`<div class="muted">فیلتر تخصصی در دسترس نیست: ${esc(e.message)}</div>`}
}
function fieldControl(f,prefix){
    let id=`${prefix}_${f.field_id}`,opts=Array.isArray(f.field_options)?f.field_options:[];
    let input='';
    if(f.field_type==='select'||f.field_type==='multiselect')input=`<select id="${id}" ${f.field_type==='multiselect'?'multiple':''}>${f.field_type==='select'?'<option value="">انتخاب کنید</option>':''}${opts.map(o=>`<option value="${esc(typeof o==='object'?o.value:o)}">${esc(typeof o==='object'?o.label:o)}</option>`).join('')}</select>`;
    else if(f.field_type==='boolean')input=`<select id="${id}"><option value="">انتخاب کنید</option><option value="true">بله</option><option value="false">خیر</option></select>`;
    else input=`<input id="${id}" type="${f.field_type==='number'?'number':f.field_type==='date'?'date':'text'}" placeholder="${f.field_type==='number'?'مقدار': 'وارد کنید'}">`;
    return `<div class="field"><label>${esc(f.field_name)}${f.is_required?' *':''}</label>${input}</div>`
}
function applyDynamicFilters(){
    let filters=[];
    for(const f of state.fields){
        let el=$(`filter_${f.field_id}`);if(!el)continue;
        let val=f.field_type==='multiselect'?Array.from(el.selectedOptions).map(o=>o.value):el.value;
        if(val===''||(Array.isArray(val)&&!val.length))continue;
        filters.push({field_id:f.field_id,value:val,operator:'eq'})
    }
    state.search.attribute_filters=filters;
    loadSearch()
}

    catch(e){toast(e.message,true)}
}


/* 👁️ تابع نمایش/مخفی کردن رمز عبور */
function togglePassword(inputId, btn) {
    let input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁️";
    }
}


/* 🔒 فرم ورود/ثبت‌نام با آیکون چشم */
function openAuth(mode='login'){
    $('modalTitle').textContent=mode==='register'?'ثبت‌نام':'ورود';
    $('modalContent').innerHTML=`
        <div class="tabs">
            <button class="tab ${mode==='login'?'active':''}" onclick="openAuth('login')">ورود</button>
            <button class="tab ${mode==='register'?'active':''}" onclick="openAuth('register')">ثبت‌نام</button>
        </div>
        ${mode==='register'?'<div class="field"><label>نام و نام خانوادگی</label><input id="authName"></div>':''}
        <div class="field"><label>شماره موبایل</label><input id="authPhone" inputmode="tel"></div>
        ${mode==='register'?'<div class="field"><label>ایمیل اختیاری</label><input id="authEmail" type="email"></div>':''}
        <div class="field">
            <label>رمز عبور</label>
            <div class="password-wrapper">
                <input id="authPassword" type="password" minlength="8">
                <button type="button" class="eye-btn" onclick="togglePassword('authPassword', this)">👁️</button>
            </div>
        </div>
        <button class="btn" style="width:100%" onclick="${mode==='register'?'register()':'login()'}">${mode==='register'?'ایجاد حساب':'ورود'}</button>
    `;
    $('modal').classList.remove('hidden')
}
async function login(){
    try{
        let d=dataObj(await api('POST','login',{phone:$('authPhone').value,password:$('authPassword').value,device_info:navigator.userAgent.slice(0,150)}));
        if(!d.token)throw Error('توکن ورود در پاسخ API وجود ندارد.');
        state.token=d.token;localStorage.setItem(TOKEN_KEY,d.token);state.user=d.user||{};
        closeModal();header();toast('ورود موفق بود');go('dashboard')
    }catch(e){toast(e.message,true)}
}
async function register(){
    try{
        await api('POST','register',{name:$('authName').value,phone:$('authPhone').value,email:$('authEmail').value,password:$('authPassword').value});
        toast('ثبت‌نام انجام شد؛ اکنون وارد شوید.');openAuth('login')
    }catch(e){toast(e.message,true)}
}
async function logout(){
    try{await api('POST','logout',{token:state.token})}catch{}
    state.token='';state.user=null;localStorage.removeItem(TOKEN_KEY);header();go('home')
}
function closeModal(){$('modal').classList.add('hidden')}
function dashboardView(){
    return `<div class="page"><div class="wrap"><div class="toolbar"><div><h2 style="margin:0">داشبورد فروشنده</h2><div class="muted">مدیریت کسب‌وکارها و آگهی‌ها</div></div><button class="btn ghost small" onclick="logout()">خروج</button></div><div class="tabs"><button class="tab active" id="tabBusinesses" onclick="dashTab('businesses')">کسب‌وکارها</button><button class="tab" id="tabServices" onclick="dashTab('services')">آگهی‌ها</button><button class="tab" id="tabProfile" onclick="dashTab('profile')">حساب کاربری</button></div><div id="dashContent"><div class="empty">در حال دریافت اطلاعات...</div></div></div></div>`

async function loadDashboard(){
    if(!state.token){openAuth('login');return}
    try{state.user=dataObj(await api('POST','get_profile',{token:state.token}));await dashTab('businesses')}
    catch(e){toast(e.message,true)}
}
async function dashTab(tab){
    state.activeTab=tab;
    ['businesses','services','profile'].forEach(x=>$('tab'+x[0].toUpperCase()+x.slice(1))?.classList.toggle('active',x===tab));
    let el=$('dashContent');if(!el)return;
    el.innerHTML='<div class="empty">در حال بارگذاری...</div>';
    try{
        if(tab==='businesses'){
            let d=await api('POST','get_my_businesses',{token:state.token,page:1,limit:100});
            state.businesses=arr(d,'businesses','items');
            el.innerHTML=`<div class="toolbar"><b>کسب‌وکارهای من</b><button class="btn" onclick="businessForm()">+ ثبت کسب‌وکار</button></div><div class="grid">${state.businesses.length?state.businesses.map(b=>`<div class="card"><div class="card-body"><h3>${esc(b.business_name)}</h3><span class="status ${b.verification_status==='verified'?'good':''}">${b.verification_status==='verified'?'تأییدشده':'در انتظار تأیید'}</span><p class="meta">${esc(locName(b.city_id))} ${esc(locName(b.province_id))}<br>${esc(b.address||'')}</p><div class="row"><button class="btn small secondary" onclick="serviceForm('','${esc(b.business_id)}')">افزودن آگهی</button><button class="btn small ghost" onclick="businessForm('${esc(b.business_id)}')">ویرایش</button><button class="btn small danger" onclick="deleteBusiness('${esc(b.business_id)}')">حذف</button></div></div></div>`).join(''):'<div class="empty">هنوز کسب‌وکاری ثبت نکرده‌اید.</div>'}</div>`
        }else if(tab==='services'){
            let d=await api('POST','get_my_services',{token:state.token,page:1,limit:100});
            state.services=arr(d,'services','items');
            el.innerHTML=`<div class="toolbar"><b>آگهی‌های من</b><button class="btn" onclick="serviceForm()">+ ثبت آگهی</button></div><div class="grid">${state.services.length?state.services.map(s=>`<div class="card"><div class="card-body"><h3>${esc(s.item_name)}</h3><div class="meta">${esc(state.businesses.find(b=>String(b.business_id)===String(s.business_id))?.business_name||'')}</div><div class="price">${money(s.price,s.price_type)}</div><div class="row"><button class="btn small secondary" onclick="serviceForm('${esc(s.service_id)}')">ویرایش</button><button class="btn small danger" onclick="deleteService('${esc(s.service_id)}')">حذف</button></div></div></div>`).join(''):'<div class="empty">هنوز آگهی ثبت نکرده‌اید.</div>'}</div>`
        }else{
            el.innerHTML=`<div class="panel"><h3>حساب کاربری</h3><p>نام: ${esc(state.user.name||'')}</p><p>موبایل: ${esc(state.user.phone||'')}</p><p>ایمیل: ${esc(state.user.email||'')}</p></div>`
        }
    }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function businessForm(id=''){
    let b=state.businesses.find(x=>String(x.business_id)===String(id))||{};
    let catOpts=state.categories.map(c=>`<option value="${esc(c.category_id)}">${esc(c.category_name)}</option>`).join('');
    $('modalTitle').textContent=id?'ویرایش کسب‌وکار':'ثبت کسب‌وکار';
    $('modalContent').innerHTML=`<div class="field"><label>نام کسب‌وکار *</label><input id="bName" value="${esc(b.business_name||'')}"></div><div class="field"><label>توضیحات</label><textarea id="bDesc">${esc(b.business_description||'')}</textarea></div><div class="field"><label>دسته اصلی فعالیت *</label><select id="bCat" onchange="businessSubs()"><option value="">انتخاب کنید</option>${catOpts}</select></div><div class="field"><label>زیردسته</label><select id="bSub" onchange="businessBranches()"><option value="">انتخاب کنید</option></select></div><div class="field"><label>زیرمجموعه</label><select id="bBranch"><option value="">انتخاب کنید</option></select></div><div class="field"><label>دسته‌های فعالیت اضافی</label><select id="bExtraCats" multiple size="4">${catOpts}</select><small class="muted">در صورت داشتن فعالیت‌های دیگر، آن‌ها را انتخاب کنید.</small></div><div class="field"><label>استان *</label><select id="bProvince" onchange="businessCities()">${provinceOptions(b.province_id)}</select></div><div class="field"><label>شهر</label><select id="bCity">${cityOptions(b.province_id,b.city_id)}</select></div><div class="two"><div class="field"><label>موبایل</label><input id="bMobile" inputmode="tel" value="${esc(b.mobile||'')}"></div><div class="field"><label>تلفن ثابت</label><input id="bPhone" value="${esc(b.phone||'')}"></div></div><div class="field"><label>نشانی</label><textarea id="bAddress">${esc(b.address||'')}</textarea></div><div class="two"><div class="field"><label>وب‌سایت</label><input id="bWebsite" value="${esc(b.website||'')}"></div><div class="field"><label>اینستاگرام</label><input id="bInstagram" value="${esc(b.instagram||'')}"></div></div><button class="btn" onclick="saveBusiness('${esc(id)}')">${id?'ذخیره تغییرات':'ثبت کسب‌وکار'}</button>`;
    $('modal').classList.remove('hidden');
    if(b.category_id){$('bCat').value=b.category_id;businessSubs(b.subcategory_id,b.subbranch_id)}
    (b.categories||[]).filter(x=>!x.is_primary&&String(x.category_id)!==String(b.category_id)).forEach(x=>{let op=Array.from($('bExtraCats').options).find(o=>o.value===String(x.category_id));if(op)op.selected=true})
}
function businessSubs(sub='',branch=''){
    $('bSub').innerHTML='<option value="">انتخاب کنید</option>'+state.subcategories.filter(x=>String(x.category_id)===$('bCat').value).map(x=>`<option value="${esc(x.subcategory_id)}" ${String(x.subcategory_id)===String(sub)?'selected':''}>${esc(x.subcategory_name)}</option>`).join('');
    businessBranches(branch)
}
function businessBranches(branch=''){
    $('bBranch').innerHTML='<option value="">انتخاب کنید</option>'+state.subbranches.filter(x=>String(x.subcategory_id)===$('bSub').value).map(x=>`<option value="${esc(x.subbranch_id)}" ${String(x.subbranch_id)===String(branch)?'selected':''}>${esc(x.subbranch_name)}</option>`).join('')
}
function businessCities(){$('bCity').innerHTML=cityOptions($('bProvince').value)}
async function saveBusiness(id=''){
    let p={token:state.token,business_name:$('bName').value,business_description:$('bDesc').value,category_id:$('bCat').value,subcategory_id:$('bSub').value,subbranch_id:$('bBranch').value,province_id:$('bProvince').value,city_id:$('bCity').value,mobile:$('bMobile').value,phone:$('bPhone').value,address:$('bAddress').value,website:$('bWebsite').value,instagram:$('bInstagram').value,additional_categories:Array.from($('bExtraCats').selectedOptions).filter(o=>o.value!==$('bCat').value).map(o=>({category_id:o.value}))};
    try{
        if(id){p.business_id=id;await api('POST','update_business',p)}
        else await api('POST','create_business',p);
        closeModal();toast(id?'اطلاعات کسب‌وکار به‌روزرسانی شد.':'کسب‌وکار ثبت شد؛ پس از تأیید در جست‌وجوی عمومی نمایش داده می‌شود.');
        await dashTab('businesses')
    }catch(e){toast(e.message,true)}
}
async function allowedBusinessCategories(businessId){
    let b=state.businesses.find(x=>String(x.business_id)===String(businessId));
    let ids=new Set([String(b?.category_id||'')]);
    (b?.categories||[]).forEach(x=>ids.add(String(x.category_id)));
    return state.categories.filter(c=>ids.has(String(c.category_id)))
}
async function deleteBusiness(id){
    if(!confirm('این کسب‌وکار حذف شود؟'))return;
    try{await api('POST','delete_business',{token:state.token,business_id:id});toast('کسب‌وکار حذف شد.');await dashTab('businesses')}
    catch(e){toast(e.message,true)}
}
async function serviceForm(id='',bizId=''){
    if(!state.businesses.length){let d=await api('POST','get_my_businesses',{token:state.token,page:1,limit:100});state.businesses=arr(d,'businesses','items')}
    if(!state.businesses.length){toast('ابتدا یک کسب‌وکار ثبت کنید.',true);return}
    state.editingService=id?state.services.find(s=>String(s.service_id)===String(id)):null;
    let s=state.editingService||{};
    $('modalTitle').textContent=id?'ویرایش آگهی':'ثبت آگهی جدید';
    $('modalContent').innerHTML=`<div class="field"><label>کسب‌وکار *</label><select id="sBiz">${state.businesses.map(b=>`<option value="${esc(b.business_id)}" ${String(b.business_id)==String(bizId||s.business_id)?'selected':''}>${esc(b.business_name)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>نوع آگهی</label><select id="sType"><option value="service">خدمت</option><option value="product">محصول</option><option value="menu">منو</option></select></div><div class="field"><label>دسته اصلی *</label><select id="sCat" onchange="serviceSubs()"><option value="">انتخاب کنید</option>${allowedBusinessCategories(bizId||s.business_id||state.businesses[0].business_id).map(c=>`<option value="${esc(c.category_id)}">${esc(c.category_name)}</option>`).join('')}</select></div></div><div class="field"><label>زیردسته</label><select id="sSub" onchange="serviceBranches()"><option value="">انتخاب کنید</option></select></div><div class="field"><label>زیرمجموعه</label><select id="sBranch"><option value="">انتخاب کنید</option></select></div><div class="field"><label>عنوان آگهی *</label><input id="sName" maxlength="200" value="${esc(s.item_name||'')}"></div><div class="field"><label>توضیحات</label><textarea id="sDesc">${esc(s.description||'')}</textarea></div><div class="three"><div class="field"><label>قیمت</label><input id="sPrice" type="number" min="0" value="${esc(s.price||'')}"></div><div class="field"><label>نوع قیمت</label><select id="sPriceType"><option value="fixed">ثابت</option><option value="starting_from">شروع از</option><option value="negotiable">توافقی</option><option value="free">رایگان</option><option value="contact">تماس بگیرید</option></select></div><div class="field"><label>واحد</label><input id="sUnit" value="${esc(s.unit||'')}"></div></div><div class="field"><label>برند</label><input id="sBrand" value="${esc(s.brand||'')}"></div><div id="serviceFields"></div><div class="field"><label>تصویر (اختیاری)</label><input id="sImage" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn" onclick="saveService()">ذخیره آگهی</button>`;
    $('modal').classList.remove('hidden');
    $('sBiz').addEventListener('change',()=>{
        let opts=allowedBusinessCategories($('sBiz').value);
        $('sCat').innerHTML='<option value="">انتخاب کنید</option>'+opts.map(c=>`<option value="${esc(c.category_id)}">${esc(c.category_name)}</option>`).join('');
        $('sSub').innerHTML='<option value="">انتخاب کنید</option>';
        $('sBranch').innerHTML='<option value="">انتخاب کنید</option>';
        loadServiceFields()
    });
    if(s.item_type)$('sType').value=s.item_type;
    if(s.price_type)$('sPriceType').value=s.price_type;
    if(s.category_id){$('sCat').value=s.category_id;serviceSubs(s.subcategory_id,s.subbranch_id)}
    $('sCat').addEventListener('change',()=>loadServiceFields());
    $('sSub').addEventListener('change',()=>loadServiceFields());
    $('sBranch').addEventListener('change',()=>loadServiceFields());
    if(!s.category_id)loadServiceFields()
}
function serviceSubs(sub='',branch=''){
    $('sSub').innerHTML='<option value="">انتخاب کنید</option>'+state.subcategories.filter(x=>String(x.category_id)===$('sCat').value).map(x=>`<option value="${esc(x.subcategory_id)}" ${String(x.subcategory_id)===String(sub)?'selected':''}>${esc(x.subcategory_name)}</option>`).join('');
    serviceBranches(branch);
    loadServiceFields()
}
function serviceBranches(branch=''){
    $('sBranch').innerHTML='<option value="">انتخاب کنید</option>'+state.subbranches.filter(x=>String(x.subcategory_id)===$('sSub').value).map(x=>`<option value="${esc(x.subbranch_id)}" ${String(x.subbranch_id)===String(branch)?'selected':''}>${esc(x.subbranch_name)}</option>`).join('');
    loadServiceFields()
}
async function loadServiceFields(){
    let box=$('serviceFields');if(!box)return;
    let c=$('sCat').value;
    if(!c){box.innerHTML='';return}
    try{
        let d=await api('POST','get_category_fields',{category_id:c,subcategory_id:$('sSub').value,subbranch_id:$('sBranch').value});
        state.fields=arr(d,'fields');
        box.innerHTML=state.fields.map(f=>fieldControl(f,'entry')).join('');
        if(state.editingService){
            let saved=arr(await api('POST','get_service_attributes',{token:state.token,service_id:state.editingService.service_id}),'attributes');
            saved.forEach(a=>{
                let el=$(`entry_${a.field_id}`);if(!el)return;
                if(a.field_type==='multiselect'){let vals=[];try{vals=JSON.parse(a.value||'[]')}catch{};Array.from(el.options).forEach(o=>o.selected=vals.includes(o.value))}
                else el.value=a.value??''
            })
        }
    }catch(e){box.innerHTML=`<div class="muted">فیلدهای تخصصی دریافت نشد: ${esc(e.message)}</div>`}
}
function readFieldValues(){
    let out={};
    for(const f of state.fields){
        let el=$(`entry_${f.field_id}`);if(!el)continue;
        let v=f.field_type==='multiselect'?Array.from(el.selectedOptions).map(o=>o.value):el.value;
        if(v!==''&&(!Array.isArray(v)||v.length))out[f.field_key]=v
    }
    return out
}
async function fileToBase64(file){
    if(file.size>2*1024*1024)throw Error('حجم تصویر حداکثر ۲ مگابایت است.');
    if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('فرمت تصویر باید JPG، PNG یا WEBP باشد.');
    return await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(Error('خواندن تصویر ناموفق بود.'));r.readAsDataURL(file)})
}
async function saveService(){
    let p={token:state.token,business_id:$('sBiz').value,item_type:$('sType').value,category_id:$('sCat').value,subcategory_id:$('sSub').value,subbranch_id:$('sBranch').value,item_name:$('sName').value,description:$('sDesc').value,price:$('sPrice').value,price_type:$('sPriceType').value,unit:$('sUnit').value,brand:$('sBrand').value};
    try{
        let d=state.editingService?await api('POST','update_service',{...p,service_id:state.editingService.service_id}):await api('POST','create_service',p);
        let sid=state.editingService?.service_id||d.service_id;
        if(!sid)throw Error('شناسه آگهی از API دریافت نشد.');
        let attrs=readFieldValues();
        if(state.fields.length)await api('POST','save_service_attributes',{token:state.token,service_id:sid,attributes:attrs});
        let f=$('sImage').files[0];
        if(f){let base64=await fileToBase64(f);await api('POST','upload_service_image',{token:state.token,service_id:sid,file_name:f.name,mime_type:f.type,file_data:base64})}
        closeModal();toast('آگهی با موفقیت ذخیره شد.');await dashTab('services')
    }catch(e){toast(e.message,true)}
}
async function deleteService(id){
    if(!confirm('این آگهی حذف شود؟'))return;
    try{await api('POST','delete_service',{token:state.token,service_id:id});toast('آگهی حذف شد.');await dashTab('services')}
    catch(e){toast(e.message,true)}
}
function openLocationFilter(){
    $('modalTitle').textContent='فیلتر استان و شهر';
    $('modalContent').innerHTML=`<div class="field"><label>استان</label><select id="locProvince" onchange="document.getElementById('locCity').innerHTML=cityOptions(this.value)">${provinceOptions(state.location.province_id)}</select></div><div class="field"><label>شهر</label><select id="locCity">${cityOptions(state.location.province_id,state.location.city_id)}</select></div><button class="btn" onclick="applyLocationFilter()">اعمال موقعیت</button> <button class="btn ghost" onclick="clearLocationFilter()">حذف فیلتر مکان</button>`;
    $('modal').classList.remove('hidden')
}
function applyLocationFilter(){
    state.location={province_id:$('locProvince').value,city_id:$('locCity').value};
    closeModal();go('search');loadSearch()
}
function clearLocationFilter(){
    state.location={province_id:'',city_id:''};
    closeModal();go('search');loadSearch()
}
function homeSearch(){
    let q=$('homeQ').value,type=$('homeType').value,province=$('homeProvince').value;
    state.path={category_id:'',subcategory_id:'',subbranch_id:''};
    state.search={q,item_type:type,sort:'newest',attribute_filters:[]};
    state.location={province_id:province,city_id:''};
    go('search');
    loadSearch()
}


init();
</script>
