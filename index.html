<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#155eef">
<title>نیازیـار | دایرکتوری هوشمند کسب‌وکارها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--blue:#155eef;--blue2:#0b45bd;--ink:#172033;--muted:#667085;--line:#e7ebf2;--bg:#f5f7fb;--card:#fff;--green:#079455;--red:#d92d20;--shadow:0 12px 32px rgba(16,24,40,.07);--radius:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(1160px,calc(100% - 32px));margin:auto}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;color:var(--blue);cursor:pointer}
.brandmark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#3984ff,#1047c5);color:#fff;display:grid;place-items:center;font-size:22px}
.navlinks{display:flex;gap:8px;align-items:center}
.navlinks button,.linkbtn{border:0;background:transparent;color:#344054;padding:10px 13px;border-radius:11px;transition:.2s}
.navlinks button:hover,.linkbtn:hover{background:#f0f4ff;color:var(--blue)}
.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:11px 17px;font-weight:700;box-shadow:0 5px 14px #155eef25;transition:.2s}
.btn:hover{background:var(--blue2)}
.btn.secondary{background:#eef4ff;color:var(--blue);box-shadow:none}
.btn.ghost{background:#fff;color:#344054;border:1px solid var(--line);box-shadow:none}
.btn.danger{background:#fff0ee;color:var(--red);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px}
.hero{padding:40px 0;background:radial-gradient(circle at 80% 10%,#dceaff 0,transparent 36%),linear-gradient(120deg,#f7faff,#edf4ff);text-align:center}
.hero h1{font-size:clamp(24px,4vw,36px);line-height:1.4;margin:0 0 10px;color:var(--ink)}
.hero p{color:var(--muted);font-size:15px;margin-bottom:22px}
.searchbox{background:#fff;padding:10px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;gap:8px;max-width:700px;margin:0 auto}
.searchbox input{flex:1;border:0;outline:none;padding:10px 15px;border-radius:10px;background:#f8fafc;font-size:14px}
.section{padding:30px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section h2{margin:0;font-size:22px;color:var(--ink)}
.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cat-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:20px 10px;text-align:center;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%}
.cat-card:hover{border-color:#9dbdff;transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-card .ico{width:44px;height:44px;border-radius:12px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-size:22px}
.cat-card b{font-size:14px;color:var(--ink);line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 12px #10182808;display:flex;flex-direction:column}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column}
.cover{height:160px;background:linear-gradient(130deg,#eaf1ff,#d5e4ff);display:grid;place-items:center;color:#6b91d8;font-size:42px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.card h3{margin:0 0 7px;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);line-height:1.9}
.price{font-weight:900;color:var(--blue);margin-top:auto;padding-top:10px;font-size:15px}
.empty{background:#fff;border:1px dashed #cfd7e5;border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.page{padding:28px 0 60px;min-height:65vh}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 16px #10182808}
.panel h2,.panel h3{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tabs,.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab,.crumb{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:11px;color:#475467;font-size:13px;transition:.2s}
.tab:hover,.crumb:hover{background:#f8fafc}
.tab.active,.crumb.active{background:#eaf1ff;color:var(--blue);border-color:#c7d9ff;font-weight:800}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.choice{display:flex;justify-content:space-between;align-items:center;text-align:right;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;margin-bottom:10px;transition:.2s}
.choice:hover{border-color:#9dbdff;background:#f8fbff;transform:translateX(-3px)}
.choice span b{display:block;font-size:15px;color:var(--ink)}
.choice span small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.choice i{font-style:normal;font-size:20px;color:#98a2b3}
.modal{position:fixed;inset:0;background:#10182880;z-index:60;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 25px 70px #0003}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modalhead strong{font-size:18px;color:var(--ink)}
.close{border:0;background:#f2f4f7;border-radius:10px;width:34px;height:34px;transition:.2s}
.close:hover{background:#e4e7ec;color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:#475467;font-weight:700}
.field input,.field select,.field textarea{width:100%;border:1px solid #d9e0eb;border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #155eef15}
.field textarea{min-height:100px;resize:vertical}
.password-wrapper{position:relative}
.password-wrapper input{padding-left:42px!important}
.eye-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#667085;padding:4px;display:flex;align-items:center;justify-content:center;transition:.2s}
.eye-btn:hover{color:var(--blue)}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:90;background:#172033;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);max-width:90%;font-size:14px;animation:slideUp .3s}
.toast.error{background:#b42318}
@keyframes slideUp{from{transform:translate(50%,20px);opacity:0}to{transform:translate(50%,0);opacity:1}}
.detail-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.detail-image{height:300px;border-radius:18px;background:#eaf1ff;overflow:hidden}
.detail-image img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:inline-block;padding:5px 10px;border-radius:30px;background:#fff4d6;color:#8a5b00;font-size:12px;margin:5px 0}
.status.good{background:#e8f7ef;color:#067647}
@media(max-width:850px){
  .hero-grid,.detail-layout{grid-template-columns:1fr}
  .searchbox{flex-direction:column}
  .searchbox button{width:100%}
  .categories-grid{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .nav{height:auto;padding:12px 0;flex-direction:column;gap:12px}
  .navlinks{width:100%;justify-content:center;flex-wrap:wrap}
}
@media(max-width:560px){
  .wrap{width:min(100% - 20px,1160px)}
  .categories-grid{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
  .section{padding:20px 0}
  .panel{padding:16px}
  .hero{padding:30px 0}
}
</style>
</head>
<body>
<header class="topbar">
    <div class="wrap nav">
        <div class="brand" onclick="go('home')"><span class="brandmark">ن</span><span>نیازیـار</span></div>
        <nav class="navlinks">
            <button onclick="go('home')">خانه</button>
            <button onclick="startSearch()">جست‌وجو</button>
            <button onclick="go('dashboard')">پنل من</button>
            <button id="authNav" class="btn small" onclick="openAuth('login')">ورود / ثبت‌نام</button>
            <button id="logoutNav" class="linkbtn hidden" onclick="logout()">خروج</button>
        </nav>
    </div>
</header>
<main id="app"></main>
<footer class="footer" style="background:#101d35;color:#d8e3f7;padding:32px 0;margin-top:30px"><div class="wrap"><div style="font-size:20px;font-weight:900;margin-bottom:8px">نیازیـار</div><div>دایرکتوری هوشمند کسب‌وکارها و خدمات</div><p><small>راهی ساده برای پیدا کردن خدمات و معرفی کسب‌وکارها</small></p></div></footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><strong id="modalTitle">ورود</strong><button class="close" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>


<script>
'use strict';


const API_URL='https://script.google.com/macros/s/AKfycbytt027SOKFskVIT0FoUsFOm_ffmIYz6TmEbF47t2Knb3GFr9YDdSFpxlFokL2g9FOw/exec';
const TOKEN_KEY='niyazyar_token_v20';


const state={
    page:'home',
    token:localStorage.getItem(TOKEN_KEY)||'',
    user:null,
    categories:[],subcategories:[],subbranches:[],locations:[],
    businesses:[],services:[],results:[],
    selectedBusiness:null,selectedService:null,
    activeTab:'businesses', // dashboard tabs
    // مسیر انتخاب شده در جستجو (درخت)
    path:{category_id:'',subcategory_id:'',subbranch_id:''},
    // فیلترهای مکان
    location:{province_id:'',city_id:''},
    // فیلترهای سرچ
    search:{q:'',sort:'newest',attribute_filters:[]},
    // فیلدهای ویژگی (برای فیلتر یا ثبت آگهی)
    fields:[],editingService:null
};


const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faNum=v=>String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹');


function toast(m,e=false){
    const t=$('toast');
    t.textContent=m;
    t.className='toast'+(e?' error':'');
    clearTimeout(toast.timer);
    toast.timer=setTimeout(()=>t.classList.add('hidden'),4000);
}


function unwrap(r){
    if(r==null)throw Error('پاسخی از سرور دریافت نشد.');
    if(typeof r==='string'){try{r=JSON.parse(r)}catch{throw Error(r)}}
    if(r.ok===false||r.success===false)throw Error(r.message||(r.error&&r.error.message)||'درخواست ناموفق بود.');
    return r.data!==undefined?r.data:r;
}


function arr(x,...keys){
    if(Array.isArray(x))return x;
    if(!x||typeof x!=='object')return[];
    for(const k of keys)if(Array.isArray(x[k]))return x[k];
    if(x.data!==undefined)return arr(x.data,...keys);
    return[];
}


async function api(method,action,payload={}){
    let raw;
    if(window.google?.script?.run){
        raw=await new Promise((resolve,reject)=>{
            let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e?.message||'خطای ارتباط')));
            if(method==='GET')r.v20HandleGetAction(action,payload);else r.v20HandlePostAction(action,{action,...payload})
        })
    }else{
        if(!API_URL)throw Error('نشانی API تنظیم نشده است.');
        let url=API_URL;
        if(method==='GET'){
            let q=new URLSearchParams({action,...Object.fromEntries(Object.entries(payload).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]))});
            raw=await(await fetch(url+(url.includes('?')?'&':'?')+q,{redirect:'follow'})).json()
        }else{
            raw=await(await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})})).json()
        }
    }
    return unwrap(raw)
}


function dataObj(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function locName(id){return state.locations.find(x=>String(x.location_id)===String(id))?.location_name||''}
function catName(id){return state.categories.find(x=>String(x.category_id)===String(id))?.category_name||''}
function subName(id){return state.subcategories.find(x=>String(x.subcategory_id)===String(id))?.subcategory_name||''}
function branchName(id){return state.subbranches.find(x=>String(x.subbranch_id)===String(id))?.subbranch_name||''}


function money(v,t='fixed'){
    if(t==='negotiable')return'توافقی';
    if(t==='free')return'رایگان';
    if(t==='contact')return'تماس بگیرید';
    if(v===''||v==null)return'تماس بگیرید';
    let n=Number(v);
    return Number.isFinite(n)?faNum(n.toLocaleString('en-US'))+' تومان':esc(v)
}


/* =====================================================
   SPA History Manager (پشتیبانی از دکمه برگشت گوشی)
   ===================================================== */
function getHistoryState(page) {
    return {
        page: page,
        path: JSON.parse(JSON.stringify(state.path)),
        location: JSON.parse(JSON.stringify(state.location)),
        search: JSON.parse(JSON.stringify(state.search)),
        selectedService: state.selectedService,
        selectedBusiness: state.selectedBusiness
    };
}


if (!history.state || !history.state.page) {
    const emptyState = {
        page: 'sentinel',
        path: { category_id:'', subcategory_id:'', subbranch_id:'' },
        location: { province_id:'', city_id:'' },
        search: { q:'', sort:'newest', attribute_filters:[] }
    };
    history.pushState(emptyState, '', '#sentinel');
    history.pushState({ ...emptyState, page:'home' }, '', '#home');
}


window.addEventListener('popstate', function(e) {
    if (!e.state || !e.state.page || e.state.page === 'sentinel') {
        history.pushState(
            { page:'home', path:{category_id:'',subcategory_id:'',subbranch_id:''}, location:{province_id:'',city_id:''}, search:{q:'',sort:'newest',attribute_filters:[]} },
            '',
            '#home'
        );
        state.page = 'home';
        state.path = { category_id:'', subcategory_id:'', subbranch_id:'' };
        state.location = { province_id:'', city_id:'' };
        state.search = { q:'', sort:'newest', attribute_filters:[] };
        state.selectedService = null;
        state.selectedBusiness = null;
        render();
        loadHomeResults();
        return;
    }


    state.page = e.state.page;
    if (e.state.path) state.path = e.state.path;
    if (e.state.location) state.location = e.state.location;
    if (e.state.search) state.search = e.state.search;
    if (e.state.selectedService !== undefined) state.selectedService = e.state.selectedService;
    if (e.state.selectedBusiness !== undefined) state.selectedBusiness = e.state.selectedBusiness;


    render();
    if (state.page === 'home') loadHomeResults();
    if (state.page === 'search') loadSearch();
    if (state.page === 'dashboard') loadDashboard();
});


/* ===================================================== */


async function init(){
    try{
        const [tree,locations]=await Promise.all([api('GET','categories_tree'),api('GET','locations')]);
        state.categories=arr(tree.categories,'categories');
        state.subcategories=arr(tree.subcategories,'subcategories');
        state.subbranches=arr(tree.subbranches,'subbranches');
        state.locations=arr(locations,'locations')
    }catch(e){
        console.warn(e);toast('دریافت اطلاعات پایه ناموفق بود: '+e.message,true)
    }
    if(state.token){
        try{state.user=dataObj(await api('POST','get_profile',{token:state.token}));}catch{state.token='';localStorage.removeItem(TOKEN_KEY)}
    }
    if (!history.state || !history.state.page) {
        history.pushState(getHistoryState('home'), '', '#home');
    }
    render();
    if(state.page==='home')loadHomeResults()
}


function header(){ $('authNav').classList.toggle('hidden',!!state.token);$('logoutNav').classList.toggle('hidden',!state.token)}


function go(p){
    history.pushState(getHistoryState(p), '', '#' + p);
    state.page=p;
    render();
    if(p==='dashboard'&&state.token)loadDashboard();
    if(p==='home')loadHomeResults()
}


function render(){
    header();
    let a=$('app');
    if(state.page==='home')a.innerHTML=homeView();
    else if(state.page==='search')a.innerHTML=searchView();
    else if(state.page==='service')a.innerHTML=serviceView();
    else if(state.page==='business')a.innerHTML=businessView();
    else if(state.page==='dashboard')a.innerHTML=dashboardView();
    else a.innerHTML=homeView()
}


/* صفحه اصلی (Home) */
function homeView(){
    let catsHtml = state.categories.map(c => `
        <div class="cat-card" onclick="chooseCategory('${esc(c.category_id)}')">
            <div class="ico">▦</div>
            <b>${esc(c.category_name)}</b>
        </div>
    `).join('');


    return `
    <section class="hero">
        <div class="wrap">
            <h1>هر نیازی، یک راه ساده برای پیدا کردن</h1>
            <p>کسب‌وکارها و خدمات موردنیاز خود را جست‌وجو کنید یا کسب‌وکارتان را ثبت کنید.</p>
            <div class="searchbox">
                <input id="homeQ" placeholder="نام خدمت، محصول یا کسب‌وکار..." onkeydown="if(event.key==='Enter')homeSearch()">
                <button class="btn" onclick="homeSearch()">جست‌وجو</button>
            </div>
        </div>
    </section>


    <section class="section">
        <div class="wrap">
            <div class="section-head">
                <h2>دسته‌بندی‌ها</h2>
                <span class="muted" style="font-size:13px">روی هر دسته کلیک کنید تا زیرشاخه‌ها را ببینید</span>
            </div>
            <div class="categories-grid">${catsHtml}</div>
        </div>
    </section>


    <section class="section">
        <div class="wrap">
            <div class="section-head">
                <h2>جدیدترین آگهی‌ها</h2>
                <button class="btn ghost small" onclick="startSearch()">مشاهده همه</button>
            </div>
            <div id="homeResults" class="grid"><div class="empty">در حال دریافت اطلاعات...</div></div>
        </div>
    </section>
    `;
}


async function loadHomeResults(){
    let el=$('homeResults');if(!el)return;
    try{
        let d=await api('GET','search_services',{sort:'newest',page:1,limit:6});
        let rows=arr(d,'items','results');
        el.innerHTML=rows.length?rows.map(serviceCard).join(''):'<div class="empty" style="grid-column:1/-1">هنوز آگهی عمومی تأییدشده‌ای ثبت نشده است.</div>'
    }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}


function startSearch(){
    state.path={category_id:'',subcategory_id:'',subbranch_id:''};
    state.search={q:'',sort:'newest',attribute_filters:[]};
    go('search');
    loadSearch();
}


function chooseCategory(id){
    state.path={category_id:id,subcategory_id:'',subbranch_id:''};
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}


function chooseSubcategory(id){
    state.path.subcategory_id=id;
    state.path.subbranch_id='';
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}


function chooseBranch(id){
    state.path.subbranch_id=id;
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}


/* محاسبه سطح فعلی بر اساس انتخاب‌های انجام شده */
function getCurrentLevel(){
    if(!state.path.category_id) return 'categories';
    if(!state.path.subcategory_id && state.subcategories.some(x=>String(x.category_id)===String(state.path.category_id))) return 'subcategories';
    if(state.path.subcategory_id && !state.path.subbranch_id && state.subbranches.some(x=>String(x.subcategory_id)===String(state.path.subcategory_id))) return 'subbranches';
    return 'final'; // آخرین سطح (نمایش محصولات و فیلترها)
}


function searchView(){
    let level=getCurrentLevel();
    let p=[];
    if(state.path.category_id) p.push({name:catName(state.path.category_id), fn:`backToLevel(0)`});
    if(state.path.subcategory_id) p.push({name:subName(state.path.subcategory_id), fn:`backToLevel(1)`});
    if(state.path.subbranch_id) p.push({name:branchName(state.path.subbranch_id), fn:`backToLevel(2)`});


    return `
    <div class="page"><div class="wrap">
        <div class="toolbar">
            <div>
                <h2 style="margin:0">جست‌وجو و فیلتر</h2>
                <div class="muted" style="font-size:13px">با انتخاب هر مرحله، آگهی‌های مرتبط با همان سطح نمایش داده می‌شوند.</div>
            </div>
            <div class="row">
                <button class="btn ghost small" onclick="openLocationFilter()">📍 ${state.location.province_id?esc(locName(state.location.province_id))+(state.location.city_id?'، '+esc(locName(state.location.city_id)):''):'فیلتر استان و شهر'}</button>
                <button class="btn ghost small" onclick="startSearch()">شروع مجدد</button>
            </div>
        </div>


        <div class="crumbs">
            <button class="crumb ${level==='categories'?'active':''}" onclick="startSearch()">همه دسته‌ها</button>
            ${p.map((item, i)=>`<button class="crumb ${i===p.length-1?'active':''}" onclick="${item.fn}">${esc(item.name)}</button>`).join('')}
        </div>


        <div class="panel" style="margin-bottom:18px">
            <div id="stepOptions" style="margin-bottom:16px">${renderStepOptions(level)}</div>
            
            ${level==='final'?`
                <div id="dynamicFilters" class="three" style="margin-top:15px; padding-top:15px; border-top:1px solid var(--line)">
                    <div class="empty" style="grid-column:1/-1">در حال بارگذاری فیلترهای تخصصی...</div>
                </div>
                <div class="row" style="margin-top:15px">
                    <button class="btn small" onclick="applyDynamicFilters()">اعمال مشخصات تخصصی</button>
                    <select id="sortSearch" onchange="state.search.sort=this.value;loadSearch()" style="max-width:180px;padding:8px;border-radius:8px;border:1px solid var(--line)">
                        <option value="newest">جدیدترین</option>
                        <option value="price_asc">ارزان‌ترین</option>
                        <option value="price_desc">گران‌ترین</option>
                    </select>
                </div>
            ` : ''}
        </div>


        <div class="toolbar">
            <strong id="resultCount">آگهی‌های مرتبط</strong>
            <span class="muted" id="searchStatus">در حال دریافت نتایج...</span>
        </div>


        <div id="searchResults" class="grid"><div class="empty">در حال دریافت آگهی‌ها...</div></div>
    </div></div>
    `;
}


function renderStepOptions(level){
    let rows=[];
    if(level==='categories'){
        rows=state.categories.map(x=>({id:x.category_id, name:x.category_name, sub:'انتخاب دسته اصلی', fn:'chooseCategory'}));
    } else if(level==='subcategories'){
        rows=state.subcategories.filter(x=>String(x.category_id)===String(state.path.category_id)).map(x=>({id:x.subcategory_id, name:x.subcategory_name, sub:'انتخاب زیردسته', fn:'chooseSubcategory'}));
    } else if(level==='subbranches'){
        rows=state.subbranches.filter(x=>String(x.subcategory_id)===String(state.path.subcategory_id)).map(x=>({id:x.subbranch_id, name:x.subbranch_name, sub:'انتخاب زیرمجموعه', fn:'chooseBranch'}));
    }
    
    // اگر به مرحله final رسیدیم، گزینه‌ای برای انتخاب نداریم
    if(level==='final') return '<div class="muted" style="margin-bottom:10px">شما در آخرین سطح این دسته‌بندی هستید. می‌توانید از فیلترهای زیر برای محدودتر کردن نتایج استفاده کنید.</div>';


    return rows.length ? rows.map(x=>`
        <button class="choice" onclick="${x.fn}('${esc(x.id)}')">
            <span><b>${esc(x.name)}</b><small>${x.sub}</small></span>
            <i>‹</i>
        </button>
    `).join('') : '<div class="empty">در این سطح گزینه فعالی ثبت نشده است.</div>';
}


function backToLevel(i){
    if(i<0){ startSearch(); return; }
    if(i===0){ state.path.subcategory_id=''; state.path.subbranch_id=''; }
    else if(i===1){ state.path.subbranch_id=''; }
    state.search.attribute_filters=[];
    go('search');
    loadSearch();
}


async function loadSearch(){
    if(state.page!=='search')return;
    let el=$('searchResults');if(el)el.innerHTML='<div class="empty">در حال دریافت آگهی‌ها...</div>';
    let statusEl=$('searchStatus'); if(statusEl) statusEl.textContent='در حال جستجو...';
    let level=getCurrentLevel();
    
    try{
        // ساخت پارامترهای API دقیقا بر اساس سطح فعلی
        let p={
            sort: state.search.sort,
            page: 1,
            limit: 30,
            q: state.search.q || undefined,
            province_id: state.location.province_id || undefined,
            city_id: state.location.city_id || undefined,
            category_id: state.path.category_id || undefined,
            subcategory_id: state.path.subcategory_id || undefined,
            subbranch_id: state.path.subbranch_id || undefined
        };
        
        if(level==='final' && state.search.attribute_filters.length){
            p.attribute_filters = JSON.stringify(state.search.attribute_filters);
        }


        // حذف کلیدهای undefined
        Object.keys(p).forEach(k => p[k] === undefined && delete p[k]);


        let d=await api('GET','search_services',p);
        state.results=arr(d,'items','results');
        
        if(el)el.innerHTML=state.results.length?state.results.map(serviceCard).join(''):'<div class="empty" style="grid-column:1/-1">در این مسیر آگهی قابل نمایشی پیدا نشد.</div>';
        
        let count=$('resultCount');
        if(count)count.textContent=`${faNum(d.total??state.results.length)} آگهی مرتبط`;
        if(statusEl) statusEl.textContent='';


        // اگر در سطح final هستیم، فیلدهای تخصصی را لود کن
        if(level==='final') await loadDynamicFields();
        
    }catch(e){
        if(el)el.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
        if(statusEl) statusEl.textContent='خطا';
    }
}


async function loadDynamicFields(){
    let box=$('dynamicFilters');if(!box)return;
    box.innerHTML='<div class="empty" style="grid-column:1/-1">در حال بارگذاری فیلترها...</div>';
    try{
        // گرفتن فیلدهای تخصصی این زیرشاخه
        let d=await api('POST','get_category_fields',{category_id:state.path.category_id,subcategory_id:state.path.subcategory_id,subbranch_id:state.path.subbranch_id});
        state.fields=arr(d,'fields').filter(x=>x.is_filterable);
        
        if(!state.fields.length){
            box.innerHTML='';
            return;
        }


        // رندر فیلترها
        box.innerHTML=state.fields.map(f=>fieldControl(f,'filter')).join('');
    }catch(e){
        box.innerHTML=`<div class="muted">فیلتر تخصصی در دسترس نیست: ${esc(e.message)}</div>`;
    }
}


function fieldControl(f,prefix){
    let id=`${prefix}_${f.field_id}`,opts=Array.isArray(f.field_options)?f.field_options:[];
    let input='';
    if(f.field_type==='select'||f.field_type==='multiselect'){
        input=`<select id="${id}" ${f.field_type==='multiselect'?'multiple':''}>${f.field_type==='select'?'<option value="">انتخاب کنید</option>':''}${opts.map(o=>`<option value="${esc(typeof o==='object'?o.value:o)}">${esc(typeof o==='object'?o.label:o)}</option>`).join('')}</select>`;
    }else if(f.field_type==='boolean'){
        input=`<select id="${id}"><option value="">انتخاب کنید</option><option value="true">بله</option><option value="false">خیر</option></select>`;
    }else{
        input=`<input id="${id}" type="${f.field_type==='number'?'number':f.field_type==='date'?'date':'text'}" placeholder="${f.field_type==='number'?'مقدار': 'وارد کنید'}">`;
    }
    return `<div class="field"><label>${esc(f.field_name)}${f.is_required?' *':''}</label>${input}</div>`;
}


function applyDynamicFilters(){
    let filters=[];
    for(const f of state.fields){
        let el=$(`filter_${f.field_id}`);if(!el)continue;
        let val=f.field_type==='multiselect'?Array.from(el.selectedOptions).map(o=>o.value):el.value;
        if(val===''||(Array.isArray(val)&&!val.length))continue;
        filters.push({field_id:f.field_id,value:val,operator:'eq'});
    }
    state.search.attribute_filters=filters;
    loadSearch();
}

/* بخش ورود و ثبت نام */
function togglePassword(inputId, btn) {
    let input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁️";
    }
}


function openAuth(mode='login'){
    $('modalTitle').textContent=mode==='register'?'ثبت‌نام':'ورود';
    $('modalContent').innerHTML=`
        <div class="tabs">
            <button class="tab ${mode==='login'?'active':''}" onclick="openAuth('login')">ورود</button>
            <button class="tab ${mode==='register'?'active':''}" onclick="openAuth('register')">ثبت‌نام</button>
        </div>
        ${mode==='register'?'<div class="field"><label>نام و نام خانوادگی</label><input id="authName"></div>':''}
        <div class="field"><label>شماره موبایل</label><input id="authPhone" inputmode="tel"></div>
        ${mode==='register'?'<div class="field"><label>ایمیل اختیاری</label><input id="authEmail" type="email"></div>':''}
        <div class="field">
            <label>رمز عبور</label>
            <div class="password-wrapper">
                <input id="authPassword" type="password" minlength="8">
                <button type="button" class="eye-btn" onclick="togglePassword('authPassword', this)">👁️</button>
            </div>
        </div>
        <button class="btn" style="width:100%" onclick="${mode==='register'?'register()':'login()'}">${mode==='register'?'ایجاد حساب':'ورود'}</button>
    `;
    $('modal').classList.remove('hidden');
}


async function login(){
    try{
        let d=dataObj(await api('POST','login',{phone:$('authPhone').value,password:$('authPassword').value,device_info:navigator.userAgent.slice(0,150)}));
        if(!d.token)throw Error('توکن ورود در پاسخ API وجود ندارد.');
        state.token=d.token;localStorage.setItem(TOKEN_KEY,d.token);state.user=d.user||{};
        closeModal();header();toast('ورود موفق بود');
        go('dashboard'); // بعد از ورود مستقیم میره داشبورد
    }catch(e){toast(e.message,true)}
}


async function register(){
    try{
        await api('POST','register',{name:$('authName').value,phone:$('authPhone').value,email:$('authEmail').value,password:$('authPassword').value});
        toast('ثبت‌نام انجام شد؛ اکنون وارد شوید.');openAuth('login');
    }catch(e){toast(e.message,true)}
}


async function logout(){
    try{await api('POST','logout',{token:state.token})}catch{}

}

async function dashTab(tab){
    state.activeTab=tab;
    ['business','products','profile'].forEach(x=>$('tab'+x.charAt(0).toUpperCase()+x.slice(1))?.classList.toggle('active',x===tab));
    let el=$('dashContent'); if(!el) return;
    el.innerHTML='<div class="empty">در حال بارگذاری...</div>';


    if(tab==='business'){
        if(!state.businesses.length){
            el.innerHTML = `
                <div class="panel" style="text-align:center;padding:40px 20px">
                    <h3>شما هنوز کسب‌وکاری ثبت نکرده‌اید</h3>
                    <p class="muted">برای ثبت محصولات، ابتدا باید مشخصات کسب‌وکار خود را ثبت کنید.</p>
                    <button class="btn" onclick="businessForm()" style="margin-top:15px">+ ثبت کسب‌وکار</button>

        // فقط اولین کسب‌وکار رو نشون میدیم (طبق خواسته کاربر، معمولا یک کسب‌وکار داریم)
        let b = state.businesses[0];
        el.innerHTML = `

                <h3>مشخصات کسب‌وکار</h3>
                <p>نام: <b>${esc(b.business_name)}</b></p>

                <p>تلفن: ${esc(b.mobile || b.phone)}</p>
                <p>وضعیت: <span class="status ${b.verification_status==='verified'?'good':''}">${b.verification_status==='verified'?'تأییدشده':'در انتظار تأیید'}</span></p>
                <button class="btn secondary small" onclick="businessForm('${esc(b.business_id)}')" style="margin-top:15px">ویرایش مشخصات</button>
            </div>
        `;
    }
    else if(tab==='products'){
        if(!state.businesses.length){
            el.innerHTML = `<div class="empty">ابتدا کسب‌وکار خود را ثبت کنید.</div>`;
            return;
        }
        try {
            let d=await api('POST','get_my_services',{token:state.token,page:1,limit:100});
            state.services=arr(d,'services','items');
            
            let listHtml = state.services.length ? state.services.map(s=>`
                <div class="list-item" style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:8px">
                    <div style="display:flex;gap:12px;align-items:center">
                        ${s.image_url ? `<img src="${esc(s.image_url)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover">` : `<div style="width:50px;height:50px;border-radius:8px;background:#eef4ff;display:grid;place-items:center;color:#9dbdff">▦</div>`}
                        <div>
                            <b style="display:block">${esc(s.item_name)}</b>
                            <span class="muted" style="font-size:12px">${money(s.price, s.price_type)}</span>
                        </div>
                    </div>
                    <div class="row">
                        <button class="btn ghost small" onclick="editService('${esc(s.service_id)}')">ویرایش</button>
                        <button class="btn danger small" onclick="deleteService('${esc(s.service_id)}')">حذف</button>
                    </div>
                </div>
            `).join('') : `<div class="empty">هنوز محصولی ثبت نکرده‌اید.</div>`;


            el.innerHTML = `
                <div class="toolbar">
                    <b>مدیریت محصولات (ویترین)</b>
                    <button class="btn" onclick="serviceForm()">+ افزودن محصول</button>
                </div>
                ${listHtml}
            `;
        } catch(e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }
    else {
        el.innerHTML=`
            <div class="panel">
                <h3>حساب کاربری</h3>
                <p>نام: ${esc(state.user.name||'')}</p>
                <p>موبایل: ${esc(state.user.phone||'')}</p>
                <p>ایمیل: ${esc(state.user.email||'')}</p>
            </div>`;
    }
}

    $('modalTitle').textContent=id?'ویرایش کسب‌وکار':'ثبت کسب‌وکار جدید';
    $('modalContent').innerHTML=`
        <div class="field"><label>نام کسب‌وکار *</label><input id="bName" value="${esc(b.business_name||'')}"></div>
        <div class="field"><label>توضیحات</label><textarea id="bDesc">${esc(b.business_description||'')}</textarea></div>
        <div class="field"><label>دسته اصلی فعالیت *</label><select id="bCat" onchange="businessSubs()"><option value="">انتخاب کنید</option>${catOpts}</select></div>
        <div class="two">
            <div class="field"><label>زیردسته</label><select id="bSub" onchange="businessBranches()"><option value="">انتخاب کنید</option></select></div>
            <div class="field"><label>زیرمجموعه</label><select id="bBranch"><option value="">انتخاب کنید</option></select></div>
        </div>
        <div class="two">
            <div class="field"><label>استان *</label><select id="bProvince" onchange="businessCities()">${provinceOptions(b.province_id)}</select></div>
            <div class="field"><label>شهر *</label><select id="bCity">${cityOptions(b.province_id,b.city_id)}</select></div>
        </div>
        <div class="field"><label>نشانی دقیق *</label><textarea id="bAddress">${esc(b.address||'')}</textarea></div>
        <div class="two">
            <div class="field"><label>تلفن همراه *</label><input id="bMobile" inputmode="tel" value="${esc(b.mobile||'')}"></div>
            <div class="field"><label>تلفن ثابت</label><input id="bPhone" value="${esc(b.phone||'')}"></div>
        </div>
        <div class="two">
            <div class="field"><label>وب‌سایت</label><input id="bWebsite" value="${esc(b.website||'')}"></div>
            <div class="field"><label>اینستاگرام</label><input id="bInstagram" value="${esc(b.instagram||'')}"></div>
        </div>
        <button class="btn" style="width:100%" onclick="saveBusiness('${esc(id)}')">${id?'ذخیره تغییرات':'ثبت کسب‌وکار'}</button>
    `;
    $('modal').classList.remove('hidden');
    
    if(b.category_id){
        $('bCat').value=b.category_id;
        businessSubs(b.subcategory_id, b.subbranch_id);
    }
}


function businessSubs(sub='',branch=''){
    $('bSub').innerHTML='<option value="">انتخاب کنید</option>'+state.subcategories.filter(x=>String(x.category_id)===$('bCat').value).map(x=>`<option value="${esc(x.subcategory_id)}" ${String(x.subcategory_id)===String(sub)?'selected':''}>${esc(x.subcategory_name)}</option>`).join('');
    businessBranches(branch);
}
function businessBranches(branch=''){
    $('bBranch').innerHTML='<option value="">انتخاب کنید</option>'+state.subbranches.filter(x=>String(x.subcategory_id)===$('bSub').value).map(x=>`<option value="${esc(x.subbranch_id)}" ${String(x.subbranch_id)===String(branch)?'selected':''}>${esc(x.subbranch_name)}</option>`).join('');
}
function businessCities(){$('bCity').innerHTML=cityOptions($('bProvince').value)}


async function saveBusiness(id=''){
    let p={
        token:state.token,
        business_name:$('bName').value,
        business_description:$('bDesc').value,
        category_id:$('bCat').value,
        subcategory_id:$('bSub').value,
        subbranch_id:$('bBranch').value,
        province_id:$('bProvince').value,
        city_id:$('bCity').value,
        mobile:$('bMobile').value,
        phone:$('bPhone').value,
        address:$('bAddress').value,
        website:$('bWebsite').value,
        instagram:$('bInstagram').value
    };
    
    // اعتبارسنجی ساده
    if(!p.business_name || !p.category_id || !p.province_id || !p.city_id || !p.address || !p.mobile){
        toast('لطفا فیلدهای ستاره‌دار را پر کنید.', true); return;
    }


    try{
        if(id){ p.business_id=id; await api('POST','update_business',p); }
        else { await api('POST','create_business',p); }
        closeModal();
        toast(id?'اطلاعات به‌روزرسانی شد.':'کسب‌وکار ثبت شد.');
        await loadDashboard(); // ریفرش داشبورد
        dashTab('business');
    }catch(e){toast(e.message,true)}
}


/* ثبت / ویرایش محصول */
function serviceForm(id=''){
    let s = id ? state.services.find(x=>String(x.service_id)===String(id)) : {};
    let catOpts = state.categories.map(c=>`<option value="${esc(c.category_id)}">${esc(c.category_name)}</option>`).join('');
    
    $('modalTitle').textContent=id?'ویرایش محصول':'افزودن محصول جدید';
    $('modalContent').innerHTML=`
        <div class="field"><label>دسته‌بندی اصلی *</label><select id="sCat" onchange="serviceSubs()"><option value="">انتخاب کنید</option>${catOpts}</select></div>
        <div class="two">
            <div class="field"><label>زیردسته</label><select id="sSub" onchange="serviceBranches()"><option value="">انتخاب کنید</option></select></div>
            <div class="field"><label>زیرمجموعه</label><select id="sBranch"><option value="">انتخاب کنید</option></select></div>
        </div>
        
        <div class="field"><label>عنوان محصول *</label><input id="sName" maxlength="200" value="${esc(s.item_name||'')}" placeholder="مثلا چلوکباب کوبیده"></div>
        <div class="field"><label>قیمت (تومان) - اختیاری</label><input id="sPrice" type="number" min="0" value="${esc(s.price||'')}" placeholder="خالی بگذارید تا توافقی شود"></div>
        
        <div id="serviceFields" style="background:#f8fafc;padding:12px;border-radius:12px;margin-bottom:15px;display:none"></div>
        
        <div class="field"><label>توضیحات</label><textarea id="sDesc">${esc(s.description||'')}</textarea></div>
        
        <div class="field"><label>آپلود عکس (اختیاری)</label><input id="sImage" type="file" accept="image/jpeg,image/png,image/webp"></div>
        
        <button class="btn" style="width:100%" onclick="saveService('${esc(id)}')">${id?'ذخیره تغییرات':'ثبت محصول'}</button>
    `;
    $('modal').classList.remove('hidden');
    
    // ست کردن مقادیر در حالت ویرایش
    if(s.category_id){
        $('sCat').value=s.category_id;
        serviceSubs(s.subcategory_id, s.subbranch_id);
    }
}


function serviceSubs(sub='',branch=''){
    $('sSub').innerHTML='<option value="">انتخاب کنید</option>'+state.subcategories.filter(x=>String(x.category_id)===$('sCat').value).map(x=>`<option value="${esc(x.subcategory_id)}" ${String(x.subcategory_id)===String(sub)?'selected':''}>${esc(x.subcategory_name)}</option>`).join('');
    serviceBranches(branch);
    loadServiceFields();
}
function serviceBranches(branch=''){
    $('sBranch').innerHTML='<option value="">انتخاب کنید</option>'+state.subbranches.filter(x=>String(x.subcategory_id)===$('sSub').value).map(x=>`<option value="${esc(x.subbranch_id)}" ${String(x.subbranch_id)===String(branch)?'selected':''}>${esc(x.subbranch_name)}</option>`).join('');
    loadServiceFields();
}


async function loadServiceFields(){
    let box=$('serviceFields'); if(!box) return;
    let c=$('sCat').value;
    if(!c){ box.style.display='none'; return; }
    
    try{
        let d=await api('POST','get_category_fields',{category_id:c, subcategory_id:$('sSub').value, subbranch_id:$('sBranch').value});
        state.fields=arr(d,'fields');
        if(!state.fields.length){ box.style.display='none'; return; }
        
        box.style.display='block';
        box.innerHTML = `<h4 style="margin:0 0 10px 0;font-size:14px;">مشخصات محصول</h4>` + state.fields.map(f=>fieldControl(f,'entry')).join('');
    }catch(e){ box.style.display='none'; }
}


function readFieldValues(){
    let out={};
    for(const f of state.fields){
        let el=$(`entry_${f.field_id}`); if(!el) continue;
        let v=f.field_type==='multiselect'?Array.from(el.selectedOptions).map(o=>o.value):el.value;
        if(v!==''&&(!Array.isArray(v)||v.length)) out[f.field_key]=v;
    }
    return out;
}


async function saveService(id=''){
    let p = {
        token: state.token,
        business_id: state.businesses[0].business_id, // محصول همیشه به کسب و کار اصلی وصل میشه
        category_id: $('sCat').value,
        subcategory_id: $('sSub').value,
        subbranch_id: $('sBranch').value,
        item_name: $('sName').value,
        price: $('sPrice').value,
        price_type: $('sPrice').value ? 'fixed' : 'negotiable',
        description: $('sDesc').value
    };


    if(!p.item_name || !p.category_id){ toast('عنوان و دسته‌بندی الزامی است.', true); return; }


    try{
        let d = id ? await api('POST','update_service',{...p, service_id:id}) : await api('POST','create_service',p);
        let sid = id || d.service_id;
        if(!sid) throw Error('شناسه محصول دریافت نشد.');


        // ذخیره ویژگی‌ها
        let attrs = readFieldValues();
        if(state.fields.length) await api('POST','save_service_attributes',{token:state.token, service_id:sid, attributes:attrs});


        // آپلود عکس
        let f=$('sImage').files[0];
        if(f){
            if(f.size > 2*1024*1024) throw Error('حجم تصویر حداکثر 2 مگابایت است.');
            let base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(Error('خطا در خواندن عکس'));r.readAsDataURL(f)});
            await api('POST','upload_service_image',{token:state.token, service_id:sid, file_name:f.name, mime_type:f.type, file_data:base64});
        }


        closeModal(); toast('محصول با موفقیت ذخیره شد.');
        await dashTab('products');
    }catch(e){ toast(e.message, true); }
}


async function deleteService(id){
    if(!confirm('این محصول حذف شود؟')) return;
    try{ await api('POST','delete_service',{token:state.token, service_id:id}); toast('حذف شد.'); await dashTab('products'); }
    catch(e){ toast(e.message, true); }
}


/* =====================================================
   Helper Functions (Options & Filters)
   ===================================================== */
function provinceOptions(sel=''){return '<option value="">همه استان‌ها</option>'+state.locations.filter(x=>String(x.location_type).toLowerCase()==='province').map(x=>`<option value="${esc(x.location_id)}" ${String(x.location_id)===String(sel)?'selected':''}>${esc(x.location_name)}</option>`).join('')}
function cityOptions(prov='',sel=''){return '<option value="">همه شهرها</option>'+state.locations.filter(x=>String(x.location_type).toLowerCase()==='city'&&String(x.parent_id)===String(prov)).map(x=>`<option value="${esc(x.location_id)}" ${String(x.location_id)===String(sel)?'selected':''}>${esc(x.location_name)}</option>`).join('')}


function openLocationFilter(){
    $('modalTitle').textContent='فیلتر استان و شهر';
    $('modalContent').innerHTML=`
        <div class="field"><label>استان</label><select id="locProvince" onchange="document.getElementById('locCity').innerHTML=cityOptions(this.value)">${provinceOptions(state.location.province_id)}</select></div>
        <div class="field"><label>شهر</label><select id="locCity">${cityOptions(state.location.province_id,state.location.city_id)}</select></div>
        <button class="btn" style="width:100%" onclick="applyLocationFilter()">اعمال موقعیت</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="clearLocationFilter()">حذف فیلتر مکان</button>
    `;
    $('modal').classList.remove('hidden');
}
function applyLocationFilter(){
    state.location={province_id:$('locProvince').value, city_id:$('locCity').value};
    closeModal(); loadSearch();
}
function clearLocationFilter(){
    state.location={province_id:'', city_id:''};
    closeModal(); loadSearch();
}
function homeSearch(){
    let q=$('homeQ').value;
    state.path={category_id:'',subcategory_id:'',subbranch_id:''};
    state.search={q, sort:'newest', attribute_filters:[]};
    go('search'); loadSearch();
}


init();
</script>
