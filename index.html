<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نیازیار | داشبورد مدیریت</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --primary:#4f46e5; --primary-600:#4338ca; --primary-50:#eef2ff;
  --success:#10b981; --danger:#ef4444; --warning:#f59e0b; --info:#0ea5e9;
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --radius:14px; --shadow:0 4px 24px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  font-size:14.5px;
}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;border:none;}
input,textarea,select{font-family:inherit;font-size:14px;}


/* ---------- Auth Screen ---------- */
.auth-wrap{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(1200px 600px at 20% 0%, #c7d2fe 0%, transparent 55%),
             radial-gradient(1000px 500px at 100% 100%, #a5f3fc 0%, transparent 55%),
             linear-gradient(135deg,#f8fafc,#eef2ff);
}
.auth-card{
  width:100%; max-width:420px; background:var(--card);
  border-radius:22px; padding:34px 30px; box-shadow:var(--shadow-lg);
  border:1px solid #eef2ff;
}
.auth-logo{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  display:grid;place-items:center;margin:0 auto 16px;color:#fff;
  box-shadow:0 8px 24px rgba(79,70,229,.35);
}
.auth-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--muted);margin-bottom:26px;font-size:13.5px;}
.auth-tabs{
  display:flex; background:#f1f5f9; border-radius:12px; padding:4px; margin-bottom:20px;
}
.auth-tabs button{
  flex:1; padding:9px; border-radius:9px; background:transparent;
  color:var(--muted); font-weight:600; font-size:13.5px; transition:.2s;
}
.auth-tabs button.active{background:var(--card); color:var(--primary); box-shadow:0 2px 8px rgba(15,23,42,.06);}


/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{
  background:linear-gradient(180deg,#1e1b4b,#312e81);
  color:#fff; padding:22px 16px; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px;}
.brand-icon{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#818cf8,#c084fc);
  display:grid;place-items:center;font-weight:800;font-size:18px;
}
.brand-name{font-weight:800;font-size:17px;}
.brand-sub{font-size:11px;color:#c7d2fe;opacity:.8;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:10px;color:#cbd5e1;font-size:14px;font-weight:500;
  transition:.2s;background:transparent;text-align:right;width:100%;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:14px;}


.main{padding:24px 30px;overflow-x:hidden;}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border);
}
.topbar h1{font-size:22px;font-weight:800;}
.topbar-sub{color:var(--muted);font-size:13px;margin-top:2px;}
.user-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);padding:6px 14px 6px 6px;border-radius:999px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#a855f7);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;}


/* ---------- Cards & Grid ---------- */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-title{font-size:16px;font-weight:700;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1024px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:768px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:.3s;z-index:100;}
  .sidebar.open{transform:translateX(0);}
  .main{padding:18px;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
}


/* ---------- Stat Cards ---------- */
.stat{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary);}
.stat.g::before{background:var(--success);} .stat.o::before{background:var(--warning);} .stat.b::before{background:var(--info);}
.stat-label{color:var(--muted);font-size:12.5px;font-weight:500;}
.stat-value{font-size:26px;font-weight:800;margin-top:6px;}


/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;
  border-radius:10px;font-size:13.5px;font-weight:600;transition:.15s;
  background:#f1f5f9;color:var(--text);
}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.25);}
.btn-primary:hover{background:var(--primary-600);}
.btn-danger{background:#fee2e2;color:var(--danger);}
.btn-success{background:var(--success);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-icon{padding:8px;border-radius:9px;}


/* ---------- Forms ---------- */
.form-group{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.form-row{grid-template-columns:1fr;}}
.label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#334155;}
.label .req{color:var(--danger);margin-right:3px;}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:10px;background:#f8fafc;transition:.15s;font-size:13.5px;
}
.input:focus,select.input:focus,textarea.input:focus{
  outline:none;border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 3px rgba(79,70,229,.12);
}
textarea.input{min-height:90px;resize:vertical;}
.help{color:var(--muted);font-size:11.5px;margin-top:4px;}


/* ---------- List / Table ---------- */
.list-empty{
  text-align:center;padding:48px 20px;color:var(--muted);
  background:#f8fafc;border:2px dashed var(--border);border-radius:var(--radius);
}
.list-empty svg{width:52px;height:52px;opacity:.35;margin-bottom:12px;}
.list-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;border:1px solid var(--border);border-radius:12px;
  background:#fff;transition:.15s;gap:14px;
}
.list-item:hover{border-color:#c7d2fe;box-shadow:0 4px 16px rgba(79,70,229,.06);}
.list-stack{display:flex;flex-direction:column;gap:10px;}
.list-info{flex:1;min-width:0;}
.list-title{font-weight:700;font-size:14.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-meta{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;}
.list-actions{display:flex;gap:6px;flex-shrink:0;}


/* ---------- Badges ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-gray{background:#f1f5f9;color:#475569;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-blue{background:#dbeafe;color:#1e40af;}


/* ---------- Modal ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  z-index:1000;display:grid;place-items:center;padding:20px;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  animation:slideUp .25s;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:17px;font-weight:800;}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start;}
.close-btn{background:#f1f5f9;border-radius:9px;padding:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);}


/* ---------- Toast ---------- */
.toast-container{position:fixed;top:20px;left:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:#fff;border-radius:12px;padding:14px 18px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  min-width:280px;max-width:400px;border-right:4px solid var(--primary);
  animation:slideIn .3s;
}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-right-color:var(--success);}
.toast.error{border-right-color:var(--danger);}
.toast.warning{border-right-color:var(--warning);}


/* ---------- Loading ---------- */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-page{display:grid;place-items:center;padding:60px;color:var(--muted);}
.loading-page .spinner{width:36px;height:36px;border-color:var(--border);border-top-color:var(--primary);}


/* ---------- Misc ---------- */
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;color:#334155;}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.media-thumb{position:relative;border-radius:12px;overflow:hidden;background:#f1f5f9;aspect-ratio:1;}
.media-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.media-thumb .primary-tag{position:absolute;top:6px;right:6px;background:var(--success);color:#fff;font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600;}
.media-thumb .media-actions{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:8px;display:flex;gap:4px;justify-content:flex-end;}
.media-thumb .media-actions button{background:rgba(255,255,255,.9);color:#0f172a;padding:5px;border-radius:6px;font-size:11px;}
.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:10px;margin-bottom:16px;width:fit-content;}
.tabs button{padding:8px 16px;border-radius:7px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;transition:.15s;}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(15,23,42,.06);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;}
.kv dt{color:var(--muted);font-weight:500;}
.kv dd{font-weight:600;}
</style>
</head>
<body>


<!-- ===================== AUTH SCREEN ===================== -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <h1 class="auth-title">نیازیار</h1>
    <p class="auth-sub">پلتفرم مدیریت کسب‌وکار و خدمات</p>


    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">ورود</button>
      <button id="tabRegister" onclick="switchAuthTab('register')">ثبت‌نام</button>
    </div>


    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="label">شماره موبایل <span class="req">*</span></label>
        <input class="input" name="phone" type="tel" placeholder="09xxxxxxxxx" required />
      </div>
      <div class="form-group">
        <label class="label">رمز عبور <span class="req">*</span></label>
        <input class="input" name="password" type="password" required />
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit" id="loginBtn">ورود به حساب</button>
    </form>


    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="label">نام و نام خانوادگی <span class="req">*</span></label>
        <input class="input" name="name" required maxlength="100" />
      </div>
      <div class="form-group">
        <label class="label">شماره موبایل <span class="req">*</span></label>
        <input class="input" name="phone" type="tel" placeholder="09xxxxxxxxx" required />
      </div>
      <div class="form-group">
        <label class="label">ایمیل</label>
        <input class="input" name="email" type="email" placeholder="اختیاری" />
      </div>
      <div class="form-group">
        <label class="label">رمز عبور <span class="req">*</span></label>
        <input class="input" name="password" type="password" minlength="8" maxlength="128" required />
        <div class="help">حداقل ۸ کاراکتر</div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit" id="registerBtn">ساخت حساب</button>
    </form>
  </div>
</div>


<!-- ===================== APP ===================== -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">ن</div>
      <div>
        <div class="brand-name">نیازیار</div>
        <div class="brand-sub">پنل مدیریت</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="handleLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>خروج</span>
      </button>
    </div>
  </aside>


  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">داشبورد</h1>
        <div class="topbar-sub" id="pageSub">خوش آمدید</div>
      </div>
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">؟</div>
        <div style="font-size:13px;font-weight:600;" id="userName">کاربر</div>
      </div>
    </div>
    <div id="viewContainer"></div>
  </main>
</div>


<div id="modalRoot"></div>
<div id="toastRoot" class="toast-container"></div>


<script>
/* =====================================================
   CONFIG (URL شما قبلاً تنظیم شده است)
   ===================================================== */
const API_CONFIG = {
  BASE_URL: "https://script.google.com/macros/s/AKfycbyjPc4aJh7UK_DkHUsglAAYyGHhVODUcFrxJAY6Wnw_KSVCymqzEaVI85zmewLpQR1mcg/exec"
};


/* =====================================================
   STATE
   ===================================================== */
const state = {
  token: localStorage.getItem("nyz_token") || null,
  user: null,
  currentView: "dashboard",
  cache: {
    categories: null, subcategories: null, subbranches: null,
    provinces: null, cities: {}
  },
  context: { businessId: null, serviceId: null }
};


/* =====================================================
   API CLIENT
   ===================================================== */
async function apiGet(params = {}) {
  const url = new URL(API_CONFIG.BASE_URL);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v); });
  const res = await fetch(url.toString(), { method: "GET", redirect: "follow" });
  return res.json();
}


async function apiPost(payload) {
  const res = await fetch(API_CONFIG.BASE_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    redirect: "follow"
  });
  return res.json();
}


async function api(payload) {
  if (state.token && payload.token === undefined && payload.action !== "login" && payload.action !== "register") {
    payload.token = state.token;
  }
  const res = await apiPost(payload);
  if (!res || !res.ok) {
    const msg = (res && res.error) || "خطای ناشناخته";
    if (msg.includes("نشست") || msg.includes("توکن")) {
      setTimeout(handleLogout, 1500);
    }
    throw new Error(msg);
  }
  return res;
}


/* =====================================================
   UI HELPERS
   ===================================================== */
function toast(msg, type = "info") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  const icons = { success: "✓", error: "✕", warning: "!", info: "i" };
  const colors = { success: "success", error: "danger", warning: "warning", info: "primary" };
  el.innerHTML = `<strong style="font-size:14px;font-weight:800;color:var(--${colors[type] || 'primary'})">${icons[type] || "i"}</strong><span>${escapeHtml(msg)}</span>`;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(-20px)"; el.style.transition = ".3s"; setTimeout(() => el.remove(), 300); }, 3800);
}


function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


function openModal(title, bodyHtml, footHtml) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="close-btn" onclick="closeModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ""}
      </div>
    </div>`;
}


function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }


function confirmDialog(message) {
  return new Promise(resolve => {
    openModal("تأیید عملیات",
      `<p>${escapeHtml(message)}</p>`,
      `<button class="btn btn-danger" id="cfmYes">تأیید</button>
       <button class="btn btn-ghost" id="cfmNo">انصراف</button>`
    );
    document.getElementById("cfmYes").onclick = () => { closeModal(); resolve(true); };
    document.getElementById("cfmNo").onclick = () => { closeModal(); resolve(false); };
  });
}


function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}


function fmtDate(s) {
  if (!s) return "—";
  try {
    const d = new Date(s);
    if (isNaN(d)) return s;
    return d.toLocaleString("fa-IR", { dateStyle: "short", timeStyle: "short" });
  } catch { return s; }
}


function loading() {
  return `<div class="loading-page"><div class="spinner"></div></div>`;
}


/* =====================================================
   AUTH
   ===================================================== */
function switchAuthTab(tab) {
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabRegister").classList.toggle("active", tab === "register");
  document.getElementById("loginForm").classList.toggle("hidden", tab !== "login");
  document.getElementById("registerForm").classList.toggle("hidden", tab !== "register");
}


async function handleLogin(ev) {
  ev.preventDefault();
  const btn = document.getElementById("loginBtn");
  const fd = new FormData(ev.target);
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> در حال ورود...`;
  try {
    const res = await apiPost({
      action: "login",
      phone: fd.get("phone").trim(),
      password: fd.get("password")
    });
    if (!res.ok) throw new Error(res.error || "ورود ناموفق");
    state.token = res.data.token;
    localStorage.setItem("nyz_token", state.token);
    toast("ورود موفق", "success");
    await bootstrapApp();
  } catch (e) {
    toast(e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "ورود به حساب";
  }
}


async function handleRegister(ev) {
  ev.preventDefault();
  const btn = document.getElementById("registerBtn");
  const fd = new FormData(ev.target);
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> در حال ثبت‌نام...`;
  try {
    const res = await apiPost({
      action: "register",
      name: fd.get("name").trim(),
      phone: fd.get("phone").trim(),
      password: fd.get("password"),
      email: (fd.get("email") || "").trim()
    });
    if (!res.ok) throw new Error(res.error || "ثبت‌نام ناموفق");
    toast("ثبت‌نام موفق! حالا وارد شوید.", "success");
    switchAuthTab("login");
    ev.target.reset();
  } catch (e) {
    toast(e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "ساخت حساب";
  }
}


function handleLogout() {
  if (state.token) {
    api({ action: "logout" }).catch(() => {});
  }
  state.token = null; state.user = null;
  localStorage.removeItem("nyz_token");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
}

  state.cache.subcategories = res.data.subcategories || [];
  state.cache.subbranches = res.data.subbranches || [];
}
async function loadProvinces() {
  if (state.cache.provinces) return;
  const res = await apiGet({ action: "locations", type: "province" });
  state.cache.provinces = res.data || [];

async function loadCities(provinceId) {
  if (state.cache.cities[provinceId]) return state.cache.cities[provinceId];
  const res = await apiGet({ action: "locations", type: "city", parent_id: provinceId });
  state.cache.cities[provinceId] = res.data || [];
  return state.cache.cities[provinceId];
}

          <label class="label">نوع</label>
          <select class="input" name="item_type">
            <option value="product" ${s.item_type === "product" ? "selected" : ""}>محصول</option>
            <option value="service" ${s.item_type === "service" ? "selected" : ""}>خدمت</option>
            <option value="menu_item" ${s.item_type === "menu_item" ? "selected" : ""}>آیتم منو</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="label">توضیحات</label>
        <textarea class="input" name="description" maxlength="3000">${escapeHtml(s.description || "")}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">نوع قیمت</label>
          <select class="input" name="price_type" id="srvPriceType">
            <option value="fixed" ${s.price_type === "fixed" ? "selected" : ""}>ثابت</option>
            <option value="negotiable" ${s.price_type === "negotiable" ? "selected" : ""}>توافقی</option>
            <option value="from" ${s.price_type === "from" ? "selected" : ""}>از ...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label">قیمت</label>
          <input class="input" name="price" value="${escapeHtml(s.price || "")}" placeholder="مثلاً 500000" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">قیمت با تخفیف</label>
          <input class="input" name="discount_price" value="${escapeHtml(s.discount_price || "")}" />
        </div>
        <div class="form-group">
          <label class="label">واحد</label>
          <input class="input" name="unit" maxlength="50" value="${escapeHtml(s.unit || "")}" placeholder="عدد / کیلو / ساعت" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">موجودی</label>
          <select class="input" name="availability">
            <option value="in_stock" ${s.availability === "in_stock" ? "selected" : ""}>موجود</option>
            <option value="out_of_stock" ${s.availability === "out_of_stock" ? "selected" : ""}>ناموجود</option>
            <option value="pre_order" ${s.availability === "pre_order" ? "selected" : ""}>پیش‌سفارش</option>
            <option value="seasonal" ${s.availability === "seasonal" ? "selected" : ""}>فصلی</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label">برند</label>
          <input class="input" name="brand" maxlength="100" value="${escapeHtml(s.brand || "")}" />
        </div>
      </div>
      <div class="form-group">
        <label class="label">آپلود تصویر جدید (اختیاری)</label>
        <input class="input" type="file" accept="image/jpeg,image/png,image/webp" id="srvImg" />
        <div class="help">حداکثر ۲ مگابایت - JPG/PNG/WEBP</div>
      </div>
    </form>`;


  openModal(existing ? "ویرایش آیتم" : "آیتم جدید", body, `
    <button class="btn btn-primary" id="srvSubmit">${existing ? "ذخیره" : "ایجاد"}</button>
    <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>`);


  const priceTypeSel = document.getElementById("srvPriceType");
  const priceInput = document.querySelector('#srvForm [name="price"]');
  const discInput = document.querySelector('#srvForm [name="discount_price"]');
  const updatePriceState = () => {
    const dis = priceTypeSel.value === "negotiable";
    priceInput.disabled = dis; if (dis) priceInput.value = "";
    discInput.disabled = dis; if (dis) discInput.value = "";
  };
  priceTypeSel.onchange = updatePriceState; updatePriceState();


  document.getElementById("srvSubmit").onclick = async () => {
    const fd = new FormData(document.getElementById("srvForm"));
    const payload = { action: existing ? "update_service" : "create_service", business_id: bizId };
    if (existing) payload.service_id = existing.service_id;
    ["item_name","item_type","description","price_type","price","discount_price","unit","availability","brand"].forEach(k => {
      const v = (fd.get(k) || "").toString().trim();
      if (v !== "") payload[k] = v;
    });
    const file = document.getElementById("srvImg").files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) { toast("حجم تصویر زیاد است", "error"); return; }
      payload.image_url = await fileToBase64(file);
    }
    try {
      await api(payload);
      toast("ذخیره شد", "success");
      closeModal();
      renderServices();
    } catch (e) { toast(e.message, "error"); }
  };
}


async function deleteService(id) {
  if (!(await confirmDialog("حذف این آیتم؟"))) return;
  try {
    await api({ action: "delete_service", service_id: id });
    toast("حذف شد", "success");
    renderServices();
  } catch (e) { toast(e.message, "error"); }
}


/* =====================================================
   VIEW: MEDIA
   ===================================================== */
async function renderMedia() {
  const bRes = await api({ action: "get_my_businesses" });
  const businesses = bRes.data || [];
  if (businesses.length === 0) {
    document.getElementById("viewContainer").innerHTML = `<div class="list-empty"><p>ابتدا کسب‌وکار بسازید</p></div>`;
    return;
  }
  if (!state.context.businessId || !businesses.find(b => b.business_id === state.context.businessId)) {
    state.context.businessId = businesses[0].business_id;
  }
  const currentBiz = businesses.find(b => b.business_id === state.context.businessId);
  const mRes = await api({ action: "get_media", owner_type: "business", owner_id: currentBiz.business_id });
  const medias = mRes.data || [];
  const byType = (t) => medias.filter(m => m.media_type === t);


  const renderMediaCard = (m) => `
    <div class="media-thumb">
      <img src="${escapeHtml(m.media_url)}" alt="" loading="lazy" />
      ${m.is_primary === "TRUE" ? `<span class="primary-tag">اصلی</span>` : ""}
      <div class="media-actions">
        ${m.is_primary !== "TRUE" ? `<button onclick="setPrimary('${m.media_id}')" title="تنظیم اصلی">★</button>` : ""}
        <button onclick="deleteMedia('${m.media_id}')" title="حذف">✕</button>
      </div>
    </div>`;


  const html = `
    <div class="card" style="margin-bottom:16px;">
      <div class="form-group" style="margin:0;">
        <label class="label">انتخاب کسب‌وکار</label>
        <select class="input" id="medBizSel">
          ${businesses.map(b => `<option value="${b.business_id}" ${b.business_id === currentBiz.business_id ? "selected" : ""}>${escapeHtml(b.business_name)}</option>`).join("")}
        </select>
      </div>
    </div>


    <div class="grid grid-2">
      <div class="card">
        <div class="card-header">
          <div class="card-title">لوگو</div>
          <label class="btn btn-primary btn-sm" style="cursor:pointer;">
            + آپلود <input type="file" hidden accept="image/*" onchange="uploadBizMedia(this,'logo')" />
          </label>
        </div>
        <div class="media-grid">${byType("logo").map(renderMediaCard).join("") || `<div class="list-empty" style="grid-column:1/-1;padding:20px;"><p style="font-size:12px;">بدون لوگو</p></div>`}</div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">کاور</div>
          <label class="btn btn-primary btn-sm" style="cursor:pointer;">
            + آپلود <input type="file" hidden accept="image/*" onchange="uploadBizMedia(this,'cover')" />
          </label>
        </div>
        <div class="media-grid">${byType("cover").map(renderMediaCard).join("") || `<div class="list-empty" style="grid-column:1/-1;padding:20px;"><p style="font-size:12px;">بدون کاور</p></div>`}</div>
      </div>
    </div>


    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <div class="card-title">گالری (${byType("gallery").length} / ۱۰)</div>
        <label class="btn btn-primary btn-sm" style="cursor:pointer;">
          + افزودن <input type="file" hidden accept="image/*" onchange="uploadBizMedia(this,'gallery')" />
        </label>
      </div>
      ${byType("gallery").length === 0 ? `<div class="list-empty"><p>بدون تصویر</p></div>` :
        `<div class="media-grid">${byType("gallery").map(renderMediaCard).join("")}</div>`}
    </div>`;


  document.getElementById("viewContainer").innerHTML = html;
  document.getElementById("medBizSel").onchange = e => {
    state.context.businessId = e.target.value;
    renderMedia();
  };
}


async function uploadBizMedia(input, type) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast("حجم تصویر زیاد است (حداکثر ۲ مگابایت)", "error"); return; }
  try {
    const b64 = await fileToBase64(file);
    await api({
      action: "upload_business_media",
      business_id: state.context.businessId,
      image_data: b64,
      media_type: type
    });
    toast("آپلود شد", "success");
    renderMedia();
  } catch (e) { toast(e.message, "error"); }
}


async function deleteMedia(id) {
  if (!(await confirmDialog("حذف این رسانه؟"))) return;
  try {
    await api({ action: "delete_media", media_id: id });
    toast("حذف شد", "success");
    renderMedia();
  } catch (e) { toast(e.message, "error"); }
}


async function setPrimary(id) {
  try {
    await api({ action: "set_primary_media", media_id: id });
    toast("تنظیم شد", "success");
    renderMedia();
  } catch (e) { toast(e.message, "error"); }
}


/* =====================================================
   VIEW: MESSAGES
   ===================================================== */
let msgTab = "inbox";
async function renderMessages() {
  const html = `
    <div class="tabs">
      <button class="${msgTab === "inbox" ? "active" : ""}" onclick="msgTab='inbox';renderMessages()">صندوق ورودی</button>
      <button class="${msgTab === "sent" ? "active" : ""}" onclick="msgTab='sent';renderMessages()">ارسالی</button>
    </div>
    <div class="card"><div id="msgList">${loading()}</div></div>`;
  document.getElementById("viewContainer").innerHTML = html;


  try {
    const res = await api({
      action: msgTab === "inbox" ? "get_received_messages" : "get_sent_messages",
      page: 1, limit: 50
    });
    const msgs = res.data || [];
    const c = document.getElementById("msgList");
    if (msgs.length === 0) {
      c.innerHTML = `<div class="list-empty"><p>پیامی وجود ندارد</p></div>`;
      return;
    }
    c.innerHTML = `<div class="list-stack">${msgs.map(m => `
      <div class="list-item" onclick='openMessageDetails(${JSON.stringify(m).replace(/'/g, "&#39;")})' style="cursor:pointer;">
        <div class="list-info">
          <div class="list-title">
            ${msgTab === "inbox" ? escapeHtml(m.sender_display_name || m.sender_id) : escapeHtml(m.receiver_id)}
            ${m.is_read === "FALSE" && msgTab === "inbox" ? `<span class="badge badge-blue" style="margin-right:6px;">جدید</span>` : ""}
          </div>
          <div class="list-meta">
            <span>${escapeHtml((m.text || "").slice(0, 80))}${(m.text || "").length > 80 ? "..." : ""}</span>
          </div>
        </div>
        <div class="list-meta" style="font-size:11px;flex-shrink:0;">
          <span>${fmtDate(m.created_at)}</span>
        </div>
      </div>`).join("")}</div>`;
  } catch (e) {
    document.getElementById("msgList").innerHTML = `<div class="list-empty"><p>خطا: ${escapeHtml(e.message)}</p></div>`;
  }
}


async function openMessageDetails(m) {
  try {
    const res = await api({ action: "get_message_details", message_id: m.message_id });
    const d = res.data;
    if (msgTab === "inbox" && d.is_read === "FALSE") {
      api({ action: "mark_message_read", message_id: d.message_id }).catch(() => {});
    }
    const guest = d.guest_contact;
    openModal("جزئیات پیام", `
      <dl class="kv">
        <dt>متن:</dt><dd style="white-space:pre-wrap;font-weight:400;">${escapeHtml(d.text)}</dd>
        ${guest ? `<dt>نام مهمان:</dt><dd>${escapeHtml(guest.name)}</dd><dt>موبایل:</dt><dd>${escapeHtml(guest.phone)}</dd>` : ""}
        <dt>تاریخ:</dt><dd>${fmtDate(d.created_at)}</dd>
        <dt>وضعیت:</dt><dd>${d.is_read === "TRUE" ? "خوانده شده" : "خوانده نشده"}</dd>
      </dl>`,
      `<button class="btn btn-danger" onclick="deleteMessage('${d.message_id}')">حذف پیام</button>
       <button class="btn btn-ghost" onclick="closeModal()">بستن</button>`
    );
  } catch (e) { toast(e.message, "error"); }
}


async function deleteMessage(id) {
  if (!(await confirmDialog("حذف این پیام؟"))) return;
  try {
    await api({ action: "delete_message", message_id: id });
    toast("حذف شد", "success");
    closeModal();
    renderMessages();
  } catch (e) { toast(e.message, "error"); }
}


/* =====================================================
   VIEW: SEARCH
   ===================================================== */
async function renderSearch() {
  const html = `
    <div class="card" style="margin-bottom:16px;">
      <form id="searchForm" style="display:flex;gap:10px;flex-wrap:wrap;">
        <input class="input" name="query" placeholder="نام محصول، برند یا توضیحات..." style="flex:1;min-width:200px;" />
        <input class="input" name="city_id" placeholder="شناسه شهر (اختیاری)" style="max-width:180px;" />
        <button class="btn btn-primary" type="submit">جستجو</button>
      </form>
    </div>
    <div id="searchResults"></div>`;
  document.getElementById("viewContainer").innerHTML = html;
  document.getElementById("searchForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const results = document.getElementById("searchResults");
    results.innerHTML = loading();
    try {
      const res = await apiGet({ action: "search_services", query: fd.get("query"), city_id: fd.get("city_id"), page: 1, limit: 20 });
      if (!res.ok) throw new Error(res.error);
      const items = res.data || [];
      if (items.length === 0) { results.innerHTML = `<div class="list-empty"><p>نتیجه‌ای یافت نشد</p></div>`; return; }
      results.innerHTML = `<div class="list-stack">${items.map(s => `
        <div class="list-item">
          <div class="list-info">
            <div class="list-title">${escapeHtml(s.item_name)}</div>
            <div class="list-meta">
              <span>${s.price_type === "negotiable" ? "توافقی" : s.price ? Number(s.price).toLocaleString("fa-IR") + " تومان" : "—"}</span>
              <span class="badge badge-blue">${s.item_type}</span>
              ${s.brand ? `<span>${escapeHtml(s.brand)}</span>` : ""}
            </div>
          </div>
        </div>`).join("")}</div>`;
    } catch (e) {
      results.innerHTML = `<div class="list-empty"><p>خطا: ${escapeHtml(e.message)}</p></div>`;
    }
  };
}


/* =====================================================
   VIEW: PROFILE
   ===================================================== */
async function renderProfile() {
  const res = await api({ action: "get_profile" });
  const u = res.data;
  document.getElementById("viewContainer").innerHTML = `
    <div class="card" style="max-width:640px;">
      <div class="card-header"><div class="card-title">اطلاعات حساب</div></div>
      <dl class="kv">
        <dt>شناسه:</dt><dd>${escapeHtml(u.user_id)}</dd>
        <dt>نام:</dt><dd>${escapeHtml(u.name)}</dd>
        <dt>موبایل:</dt><dd>${escapeHtml(u.phone)}</dd>
        <dt>ایمیل:</dt><dd>${escapeHtml(u.email || "—")}</dd>
        <dt>نقش:</dt><dd>${escapeHtml(u.role)}</dd>
        <dt>وضعیت:</dt><dd><span class="badge badge-green">${escapeHtml(u.status)}</span></dd>
        <dt>تاریخ ثبت‌نام:</dt><dd>${fmtDate(u.created_at)}</dd>
        <dt>آخرین ورود:</dt><dd>${fmtDate(u.last_login)}</dd>
      </dl>
      <div style="margin-top:20px;">
        <button class="btn btn-danger" onclick="handleLogout()">خروج از حساب</button>
      </div>
    </div>`;
}


/* =====================================================
   STARTUP
   ===================================================== */
(async function init() {
  if (state.token) {
    try { await bootstrapApp(); } catch (e) { handleLogout(); }
  }
})();
</script>
